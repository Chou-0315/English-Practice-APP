<title>每日英文練功房</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap">
<style>
/* Layout: system-app style in liquid glass — large titles, translucent panes over a drifting colour field, floating tab bar */
:root{
  --acc-l:#007AFF; --acc-d:#0A84FF;
  --bg:#F2F2F7; --surface:#FFFFFF; --ink:#000000; --muted:#8A8A8E; --line:#E5E5EA; --soft:#EFEFF4;
  --sep:#C6C6C8; --fill:rgba(118,118,128,.12); --press:rgba(0,0,0,.05); --chev:#C4C4C7; --bar:rgba(249,249,249,.86); --seg:#FFFFFF;
  --accent:var(--acc-l); --accent-d:var(--acc-l); --accent-ink:#ffffff; --tint:color-mix(in srgb,var(--accent) 12%,transparent);
  --good:#34C759; --good-d:#34C759; --bad:#FF3B30; --bad-d:#FF3B30;
  --gold:#FFCC00; --gold-d:#FFCC00; --gold-ink:#5C4400;
  --hero1:#fff; --hero2:#fff; --hero-ink:#000;
  --good-bg:#E8F8EC; --good-ink:#1E7B35; --bad-bg:#FFEBEA; --bad-ink:#B3261E;
  --ring1:#FA2D55; --ring2:#4CD964; --ring3:#1FB7E8;
  --f-disp:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","PingFang TC","Noto Sans TC",system-ui,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#000000; --surface:#1C1C1E; --ink:#FFFFFF; --muted:#8D8D93; --line:#38383A; --soft:#2C2C2E;
  --sep:#38383A; --fill:rgba(118,118,128,.24); --press:rgba(255,255,255,.06); --chev:#5A5A5E; --bar:rgba(22,22,23,.86); --seg:#636366;
  --accent:var(--acc-d); --accent-d:var(--acc-d); --accent-ink:#ffffff;
  --good:#30D158; --good-d:#30D158; --bad:#FF453A; --bad-d:#FF453A;
  --gold:#FFD60A; --gold-d:#FFD60A; --gold-ink:#3A2B00;
  --hero1:#1C1C1E; --hero2:#1C1C1E; --hero-ink:#fff;
  --good-bg:#0E2A16; --good-ink:#B9F2C6; --bad-bg:#3A1311; --bad-ink:#FFC9C5;
  --ring1:#FF375F; --ring2:#A3F03C; --ring3:#40D3F5; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#000000; --surface:#1C1C1E; --ink:#FFFFFF; --muted:#8D8D93; --line:#38383A; --soft:#2C2C2E;
  --sep:#38383A; --fill:rgba(118,118,128,.24); --press:rgba(255,255,255,.06); --chev:#5A5A5E; --bar:rgba(22,22,23,.86); --seg:#636366;
  --accent:var(--acc-d); --accent-d:var(--acc-d); --accent-ink:#ffffff;
  --good:#30D158; --good-d:#30D158; --bad:#FF453A; --bad-d:#FF453A;
  --gold:#FFD60A; --gold-d:#FFD60A; --gold-ink:#3A2B00;
  --hero1:#1C1C1E; --hero2:#1C1C1E; --hero-ink:#fff;
  --good-bg:#0E2A16; --good-ink:#B9F2C6; --bad-bg:#3A1311; --bad-ink:#FFC9C5;
  --ring1:#FF375F; --ring2:#A3F03C; --ring3:#40D3F5; color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased}
.app{display:flex;flex-direction:column;height:100%;max-width:520px;margin:0 auto}
header{padding:20px 20px 4px;display:flex;align-items:baseline;justify-content:space-between;gap:12px}
header h1{font-weight:500;font-size:1rem;margin:0;color:var(--muted);letter-spacing:.02em}
.streak{font-size:.85rem;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.streak b{color:var(--ink);font-weight:500}
main{flex:1;overflow-y:auto;padding:8px 20px 100px}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--bg);border-top:1px solid var(--line);
  padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center}
nav .in{display:grid;grid-template-columns:repeat(5,1fr);width:100%;max-width:520px}
nav button{background:none;border:0;color:var(--muted);font:inherit;font-size:.7rem;padding:8px 2px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
nav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5}
nav button[aria-current="true"]{color:var(--ink)}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h2{font-weight:500;font-size:1.5rem;margin:20px 0 4px;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:.9rem;margin:0 0 24px}
.panel{padding:4px 0}
.stack{display:flex;flex-direction:column;gap:20px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.btn{font:inherit;font-size:.95rem;font-weight:500;border-radius:10px;padding:13px 16px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer;flex:1;min-width:0}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.good,.btn.bad,.btn.meh{background:var(--soft);border-color:transparent}
.btn.good{color:var(--good)} .btn.bad{color:var(--bad)}
.btn:disabled{opacity:.35;cursor:default}
.ipa{font-family:var(--f-mono);color:var(--muted);font-size:.9rem}
.pos,.lvl{font-size:.8rem;color:var(--muted)}
.lvl::before{content:"· "}
.speak{background:none;border:0;width:36px;height:36px;display:inline-grid;place-items:center;color:var(--muted);cursor:pointer;flex:none;border-radius:50%}
.speak:hover{color:var(--ink);background:var(--soft)}
.speak svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.5}
/* Home */
.big{font-size:3rem;font-weight:300;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.big small{font-size:1rem;color:var(--muted);font-weight:400;margin-left:4px}
.meta{display:flex;gap:20px;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.meta b{color:var(--ink);font-weight:500}
.hr{height:1px;background:var(--line)}
.label{font-size:.8rem;color:var(--muted);letter-spacing:.04em}
.wotd .w{font-weight:500;font-size:2rem;line-height:1.15;letter-spacing:-.01em}
.ex{margin:10px 0 0;color:var(--ink)}
.ex .zh{color:var(--muted);font-size:.9rem}
/* Flashcard */
.card{min-height:320px;display:flex;flex-direction:column;justify-content:center;gap:8px;cursor:pointer;text-align:left}
.card .w{font-weight:500;font-size:2.6rem;line-height:1.1;word-break:break-word;letter-spacing:-.02em}
.card .meaning{font-size:1.2rem;margin-top:16px}
.hint{color:var(--muted);font-size:.85rem;margin-top:24px}
.progress{height:2px;background:var(--line);margin-bottom:8px}
.progress i{display:block;height:100%;background:var(--ink);transition:width .3s}
/* Quiz */
.q{font-weight:500;font-size:2rem;line-height:1.2;letter-spacing:-.01em}
.opts{display:grid;gap:8px}
.opt{text-align:left;font:inherit;padding:14px 16px;border-radius:10px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.opt.right{border-color:var(--good);color:var(--good)}
.opt.wrong{border-color:var(--bad);color:var(--bad)}
.feedback{min-height:1.5em;font-size:.95rem}
.feedback.ok{color:var(--good)} .feedback.no{color:var(--bad)}
/* Dictation */
input[type=text]{font:inherit;font-size:1.1rem;width:100%;padding:12px 0;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;color:var(--ink);box-sizing:border-box}
input[type=text]:focus{outline:none;border-bottom-color:var(--ink)}
.diff{line-height:2}
.diff span{margin-right:4px}
.diff .ok{color:var(--ink)} .diff .miss{color:var(--muted);text-decoration:line-through} .diff .need{color:var(--bad);text-decoration:underline;text-underline-offset:3px}
.rate{display:flex;gap:4px;align-items:center;font-size:.85rem;color:var(--muted)}
.rate button{font:inherit;font-size:.85rem;border:0;background:none;color:var(--muted);border-radius:6px;padding:4px 10px;cursor:pointer}
.rate button[aria-pressed="true"]{background:var(--soft);color:var(--ink)}
/* Builder */
.slot{min-height:56px;border-bottom:1px solid var(--line);padding:8px 0;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start}
.chip{font:inherit;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
.slot .chip{background:var(--soft);border-color:transparent}
.bank{display:flex;flex-wrap:wrap;gap:6px}
.list{display:flex;flex-direction:column}
.list .it{display:grid;grid-template-columns:1fr auto;gap:8px;padding:12px 0;border-bottom:1px solid var(--line);align-items:center}
.list .it:last-child{border-bottom:0}
.list .it b{font-weight:500}
.list .it .m{color:var(--muted);font-size:.85rem}
.dots{display:flex;gap:3px}
.dots i{width:5px;height:5px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--ink)}
.note{font-size:.8rem;color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}
/* additions */
nav .in{grid-template-columns:repeat(6,1fr)}
.chart{width:100%;height:auto;display:block}
.chart rect{fill:var(--line)} .chart rect.on{fill:var(--ink)} .chart rect.today{fill:var(--accent)}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--f-body)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.filters button{font:inherit;font-size:.85rem;border:1px solid var(--line);background:none;color:var(--muted);border-radius:999px;padding:5px 12px;cursor:pointer}
.filters button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
textarea{font-family:var(--f-mono);font-size:.75rem;width:100%;min-height:80px;padding:10px;border:1px solid var(--line);border-radius:8px;background:transparent;color:var(--ink);box-sizing:border-box;resize:vertical}
details{border-top:1px solid var(--line);padding:14px 0 0}
details summary{cursor:pointer;font-size:.9rem;list-style:none;display:flex;justify-content:space-between}
details summary::after{content:"+";color:var(--muted)}
details[open] summary::after{content:"−"}
details summary::-webkit-details-marker{display:none}
details .body{padding-top:12px;display:flex;flex-direction:column;gap:10px;font-size:.9rem}
.field{display:flex;flex-direction:column;gap:2px}
.field label{font-size:.8rem;color:var(--muted)}
.tag{font-size:.75rem;color:var(--bad);font-variant-numeric:tabular-nums}
.link{background:none;border:0;padding:0;font:inherit;font-size:.85rem;color:var(--accent);cursor:pointer}
.link.danger{color:var(--bad)}
.seg{display:flex;justify-content:space-between;align-items:baseline}
.kind{font-size:.8rem;color:var(--muted);margin-bottom:6px}
/* fun layer */
header{flex-direction:column;align-items:stretch;gap:6px}
.hd{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.lv{display:flex;align-items:center;gap:10px;font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.lv b{color:var(--ink);font-weight:500;white-space:nowrap}
.lvtrack{flex:1;height:4px;background:var(--line);border-radius:99px;overflow:hidden}
.lvtrack i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--gold));border-radius:99px;transition:width .6s cubic-bezier(.2,.8,.2,1)}
.streak b::after{content:" 🔥";font-size:.85em}
.xpfloat{position:fixed;transform:translate(-50%,0);pointer-events:none;font-weight:700;font-size:.95rem;color:var(--gold-ink);background:var(--gold);padding:2px 8px;border-radius:99px;z-index:50;animation:xpup .9s ease-out forwards}
@keyframes xpup{0%{opacity:0;transform:translate(-50%,0) scale(.8)}20%{opacity:1;transform:translate(-50%,-14px) scale(1.05)}100%{opacity:0;transform:translate(-50%,-56px)}}
.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.92rem;z-index:60;transition:all .3s;max-width:calc(100% - 32px);text-align:center}
.toast.in{transform:translate(-50%,0);opacity:1}
.toast.ach::before{content:"★ ";color:var(--gold)}
.confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:55}
.combo{margin-left:8px;color:var(--gold-ink);background:var(--gold);padding:1px 8px;border-radius:99px;font-size:.78rem;font-weight:700}
.feedback b{font-weight:700}
.opt.right{animation:pop .3s}
.opt.wrong{animation:shake .35s}
.shake{animation:shake .35s}
.slot.win{border-bottom-color:var(--good)}
.slot.win .chip{animation:pop .4s backwards}
.slot.win .chip:nth-child(2){animation-delay:.04s}.slot.win .chip:nth-child(3){animation-delay:.08s}.slot.win .chip:nth-child(4){animation-delay:.12s}.slot.win .chip:nth-child(5){animation-delay:.16s}.slot.win .chip:nth-child(n+6){animation-delay:.2s}
@keyframes pop{0%{transform:scale(1)}40%{transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-6px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.card{perspective:800px}
.card.flipin{animation:flip .35s ease-out}
@keyframes flip{0%{transform:rotateX(70deg);opacity:.3}100%{transform:none;opacity:1}}
.mode{display:flex;flex-direction:column;gap:4px;text-align:left;font:inherit;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:14px;padding:18px;cursor:pointer}
.mode:hover{border-color:var(--ink)}
.mode-t{font-size:1.15rem;font-weight:500}
.mode-d{font-size:.88rem;color:var(--muted)}
.mode-best{font-size:.8rem;color:var(--gold-ink);background:var(--gold);align-self:flex-start;padding:1px 8px;border-radius:99px;margin-top:6px}
.rush-top{display:flex;justify-content:space-between;align-items:baseline;margin-top:20px}
.rush-time{font-size:1.4rem;font-variant-numeric:tabular-nums;color:var(--muted)}
.rush-time.hot{color:var(--bad);animation:pop .5s infinite}
.timebar{height:4px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:10px}
.timebar i{display:block;height:100%;width:100%;background:var(--accent);transition:width .1s linear}
.rush-combo{min-height:1.4em;margin-top:8px;font-size:.85rem;color:var(--gold-ink);font-weight:700}
.big.bump{animation:pop .25s}
.badges{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.badge{display:flex;gap:10px;align-items:flex-start;opacity:.45}
.badge.got{opacity:1}
.badge b{font-weight:500;font-size:.9rem}
.medal{width:30px;height:30px;flex:none;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--muted);font-size:.95rem}
.badge.got .medal{background:var(--gold);color:var(--gold-ink)}
.mascot{font-size:.9rem;color:var(--muted)}
@media (max-width:360px){.badges{grid-template-columns:1fr}}
@media (prefers-reduced-motion: reduce){.xpfloat,.opt.right,.opt.wrong,.shake,.slot.win .chip,.card.flipin,.rush-time.hot,.big.bump{animation:none!important}}
.scenes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.scene{position:relative;border:1px solid var(--line);border-radius:14px;transition:border-color .2s,background .2s;min-width:0}
.scene.on{border-color:var(--ink)}
.scene-main{all:unset;box-sizing:border-box;display:flex;flex-direction:column;gap:2px;width:100%;padding:14px 14px 12px;cursor:pointer;border-radius:14px}
.scene-main:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.scene-en{font-size:.72rem;color:var(--muted);letter-spacing:.03em}
.scene-zh{font-size:1rem;font-weight:500;color:var(--ink)}
.scene-n{font-size:.75rem;color:var(--muted);font-variant-numeric:tabular-nums;margin-top:6px}
.scene-bar{display:block;height:3px;background:var(--line);border-radius:99px;overflow:hidden;margin-top:6px;margin-right:60px}
.scene-bar i{display:block;height:100%;background:var(--gold)}
.scene-tog{position:absolute;right:8px;bottom:8px;font:inherit;font-size:.7rem;border:0;border-radius:99px;padding:3px 9px;cursor:pointer;background:var(--soft);color:var(--muted)}
.scene-tog[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
/* home v2 */
.home{margin-top:12px;gap:16px}
.hero{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center;background:var(--soft);border-radius:22px;padding:18px}
.hero-ring{position:relative;width:104px;height:104px}
.ring{width:104px;height:104px;display:block}
.ring circle{fill:none;stroke-width:9}
.ring .rt{stroke:var(--line)} .ring .rv{stroke-linecap:round;transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.hero-num{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
.hero-num b{font-size:1.9rem;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.hero-num span{font-size:.75rem;color:var(--muted);margin-top:4px}
.hero-txt{min-width:0}
.hi{font-size:1.35rem;font-weight:500;letter-spacing:-.01em}
.msg{font-size:.85rem;color:var(--muted);margin-top:2px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:12px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px}
.dn{font-size:.68rem;color:var(--muted)}
.dot{width:22px;height:22px;border-radius:50%;background:var(--bg);display:grid;place-items:center;font-size:.7rem;color:var(--muted)}
.day.done .dot{background:var(--ink);color:var(--bg)}
.day.full .dot{background:var(--gold);color:var(--gold-ink)}
.day.today .dn{color:var(--ink);font-weight:500}
.day.today:not(.done) .dot{box-shadow:inset 0 0 0 1.5px var(--ink)}
.cta{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-radius:16px;font-size:1rem}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:transparent;font:inherit;color:var(--ink);text-align:left;min-width:0}
.tile b{font-size:1.4rem;font-weight:500;font-variant-numeric:tabular-nums;line-height:1.2}
.tile span{font-size:.75rem;color:var(--muted)}
button.tile{cursor:pointer}
button.tile:disabled{cursor:default}
.tile.warn{border-color:var(--bad)} .tile.warn b,.tile.warn span{color:var(--bad)}
.sec-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;font-size:.95rem;font-weight:500}
.quests{display:flex;flex-direction:column;gap:8px}
.quest{display:grid;grid-template-columns:24px 1fr auto;grid-template-rows:auto auto;column-gap:12px;row-gap:8px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:14px;background:transparent;font:inherit;color:var(--ink);text-align:left;cursor:pointer}
.qc{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--line);display:grid;place-items:center;font-size:.75rem;grid-row:span 2}
.quest.ok .qc{background:var(--good);box-shadow:none;color:var(--bg)}
.quest.ok .qn{color:var(--muted);text-decoration:line-through}
.qn{font-size:.92rem}
.qv{font-size:.8rem;color:var(--muted);font-variant-numeric:tabular-nums}
.qbar{grid-column:2 / 4;height:3px;background:var(--line);border-radius:99px;overflow:hidden}
.qbar i{display:block;height:100%;background:var(--accent)}
.quest.ok .qbar i{background:var(--good)}
.wotd2{background:var(--ink);color:var(--bg);border-radius:22px;padding:18px 20px 20px}
.wotd2 .tagline{font-size:.75rem;opacity:.65;letter-spacing:.03em}
.wotd2 .w{font-size:2.2rem;font-weight:500;letter-spacing:-.02em;line-height:1.15;margin-top:2px;word-break:break-word}
.wotd2 .ipa,.wotd2 .pos{color:inherit;opacity:.7}
.wotd2 .speak{color:var(--bg);opacity:.8}
.wotd2 .speak:hover{background:transparent;color:var(--gold);opacity:1}
.ex2{margin-top:14px;padding-top:12px;border-top:1px solid color-mix(in srgb,var(--bg) 18%,transparent);font-size:.95rem}
.ex2 .zh{opacity:.6;font-size:.85rem;margin-top:2px}
.more{display:flex;flex-direction:column;gap:14px;margin-top:4px}
@media (max-width:360px){.hero{grid-template-columns:1fr;justify-items:center;text-align:center}.hero-txt{width:100%}}
/* v2 */
nav .in{grid-template-columns:repeat(4,1fr)!important}
body.onb nav{display:none}
.back{background:none;border:0;padding:0;margin:14px 0 0;font:inherit;font-size:.85rem;color:var(--muted);cursor:pointer}
.back:hover{color:var(--ink)}
.trainbar{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;font-size:.85rem;color:var(--muted)}

/* buttons */

.dn{font-size:.68rem;color:var(--muted);font-weight:600;opacity:1;font-family:var(--f-body)}
.dot{width:26px;height:26px;background:var(--fill);box-shadow:none;font-size:.7rem;color:var(--muted)}

.train{display:flex;flex-direction:column;gap:12px;background:none;border:0;padding:0;box-shadow:none;border-radius:0}

.chest-msg{display:flex;align-items:center;gap:6px;font-size:1.0625rem;font-weight:600;min-height:1.6em;font-family:var(--f-body)}

.dotsep{color:var(--muted);margin:0 4px}

.more{display:flex;flex-direction:column;gap:12px;margin-top:0}

.syncline{padding:0 16px}
.sdot{margin-top:5px}
/* segmented controls */

.steps{gap:4px}

.inter{margin-top:30px}

.mode::after{content:"";grid-column:3;grid-row:1/3;width:8px;height:8px;border-right:2.4px solid var(--chev);border-top:2.4px solid var(--chev);transform:rotate(45deg);margin-right:4px}

/* ===== LIQUID GLASS: translucent panes over a slow-moving colour field ===== */
:root{
  --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.72); --glass-brd:rgba(255,255,255,.75);
  --glass-hi:rgba(255,255,255,.95); --glass-sh:0 10px 30px rgba(40,50,90,.10),0 1px 2px rgba(40,50,90,.06);
  --blur:saturate(180%) blur(22px);
  --aura-base:#EEF1FA; --a1:#7FB2FF; --a2:#FF9EC7; --a3:#9CF0D8; --a4:#FFD38A;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --glass:rgba(40,42,52,.48); --glass-strong:rgba(44,46,58,.72); --glass-brd:rgba(255,255,255,.16);
  --glass-hi:rgba(255,255,255,.28); --glass-sh:0 10px 30px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.3);
  --aura-base:#07080D; --a1:#2B4DFF; --a2:#C2186B; --a3:#0E9E8A; --a4:#8A4BFF}}
:root[data-theme="dark"]{
  --glass:rgba(40,42,52,.48); --glass-strong:rgba(44,46,58,.72); --glass-brd:rgba(255,255,255,.16);
  --glass-hi:rgba(255,255,255,.28); --glass-sh:0 10px 30px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.3);
  --aura-base:#07080D; --a1:#2B4DFF; --a2:#C2186B; --a3:#0E9E8A; --a4:#8A4BFF}
body{background:var(--aura-base)}
#aura{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--aura-base);pointer-events:none;--px:0;--py:0}
#aura i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.75;will-change:transform}
#aura .b1{width:70vmax;height:70vmax;left:-25vmax;top:-30vmax;background:radial-gradient(circle,var(--a1),transparent 65%);animation:drift1 22s ease-in-out infinite alternate;translate:calc(var(--px)*40px) calc(var(--py)*40px)}
#aura .b2{width:60vmax;height:60vmax;right:-25vmax;top:10vmax;background:radial-gradient(circle,var(--a2),transparent 65%);animation:drift2 26s ease-in-out infinite alternate;translate:calc(var(--px)*-50px) calc(var(--py)*30px)}
#aura .b3{width:65vmax;height:65vmax;left:-20vmax;bottom:-35vmax;background:radial-gradient(circle,var(--a3),transparent 65%);animation:drift3 30s ease-in-out infinite alternate;translate:calc(var(--px)*30px) calc(var(--py)*-45px)}
#aura .b4{width:45vmax;height:45vmax;right:-10vmax;bottom:-10vmax;background:radial-gradient(circle,var(--a4),transparent 65%);animation:drift1 34s ease-in-out infinite alternate-reverse;opacity:.6}
#aura .grain{inset:0;width:auto;height:auto;border-radius:0;filter:none;opacity:.05;background-image:radial-gradient(rgba(0,0,0,.6) 1px,transparent 1px);background-size:3px 3px}
@keyframes drift1{to{transform:translate(18vw,12vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(-20vw,18vh) scale(.9)}}
@keyframes drift3{to{transform:translate(15vw,-16vh) scale(1.1)}}
/* glass material */
.group,.ringcard,.card,.opt,.modes,.scene,.medals,details,.list,.skills,.advice,.tiles,.cel-in,.slot,.chip,input[type=text],textarea,.filters button,.item,.sw-c,.bb-top{
  background:var(--glass)!important;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glass-brd)!important;box-shadow:inset 0 1px 0 var(--glass-hi),var(--glass-sh)!important}
.sw-c{background:linear-gradient(135deg,var(--c) 50%,var(--cd) 50%)!important}

.opt.wrong{background:color-mix(in srgb,var(--bad) 22%,var(--glass))!important;border-color:var(--bad)!important}
.scene.on{border-color:var(--accent)!important;box-shadow:inset 0 0 0 1.5px var(--accent),inset 0 1px 0 var(--glass-hi),var(--glass-sh)!important}

  background:var(--glass-strong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-brd);box-shadow:inset 0 1px 0 var(--glass-hi),0 12px 40px rgba(0,0,0,.18)}

.hf,.he{width:14px;height:13px;display:inline-block;clip-path:path("M7 13 L1.2 7 A3.4 3.4 0 0 1 7 2.4 A3.4 3.4 0 0 1 12.8 7 Z")}

const itemById=id=>ITEMS.find(x=>x.id===id);
const coins=()=>Math.floor(S.xp/4)+(S.bonusC||0)-(S.spent||0);
const wear=()=>S.wear||(S.wear={});
const themeId=()=>(S.theme&&itemById(S.theme))?S.theme:"blue";
function applyTheme(){const t=itemById(themeId()),r=document.documentElement;r.style.setProperty("--acc-l",t.l);r.style.setProperty("--acc-d",t.d)}
const petStage=l=>l<=1?0:l<=3?1:l<=5?2:l<=7?3:4;
const STAGE_NAME=["新手","入門","進階","熟練","大師"];
const newToday=()=>((S.nd||{})[today()]||0);
function ringVals(){const done=S.days[today()]||0,t=tdToday(),plan=trainPlan();
  return [Math.min(1.5,done/S.goal),plan.filter(s=>t.done.includes(s.k)).length/plan.length,Math.min(1.5,newToday()/TL().nw)]}
function rings(v,size,cls){
  const R=[44,33,22],W=9.5,col=["var(--ring1)","var(--ring2)","var(--ring3)"];
  return `<svg class="rings ${cls||""}" width="${size}" height="${size}" viewBox="0 0 104 104" aria-hidden="true">${R.map((r,i)=>{const C=2*Math.PI*r,p=Math.max(0,v[i]);
    const over=p>1?`<circle cx="52" cy="52" r="${r}" fill="none" stroke="${col[i]}" stroke-width="${W}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-(p-1))}" transform="rotate(-90 52 52)" style="filter:drop-shadow(0 0 1.5px rgba(0,0,0,.35))"/>`:"";
    return `<circle cx="52" cy="52" r="${r}" fill="none" stroke="${col[i]}" stroke-opacity=".2" stroke-width="${W}"/>
      <circle class="rg" style="--c:${C};--o:${C*(1-Math.min(1,p))}" cx="52" cy="52" r="${r}" fill="none" stroke="${col[i]}" stroke-width="${W}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-Math.min(1,p))}" transform="rotate(-90 52 52)" ${p<=0?'opacity="0"':""}/>${over}`}).join("")}</svg>`}
function mascot(o={}){return rings(o.demo?[.72,.5,.34]:ringVals(),o.size||120,o.anim==="idle"?"":"")}
function petLine(){
  const done=S.days[today()]||0,g=S.goal,hr=new Date().getHours(),t=tdToday(),plan=trainPlan(),all=plan.every(s=>t.done.includes(s.k));
  if(done>=g&&all&&newToday()>=TL().nw)return ["","三個圓環都完成了。"];
  if(done>=g&&all)return ["",`再學 ${Math.max(0,TL().nw-newToday())} 個新字，就能完成所有圓環。`];
  if(all)return ["",`今日訓練已完成，再 ${Math.max(0,g-done)} 題達成目標。`];
  if(done>0)return ["",`再 ${g-done} 題達成今日目標。`];
  if(hr>=22||hr<5)return ["","睡前花幾分鐘複習，記得更牢。"];
  if(streak()>0)return ["",`已連續 ${streak()} 天。`];
  return ["",`今天還沒開始，今日訓練約需 ${minutesOf(trainPlan())} 分鐘。`];
}

  const old=document.querySelector(".sheet");if(old)old.remove();
  const el=document.createElement("div");el.className="sheet "+(ok?"ok":"no");el.setAttribute("role","status");
  el.innerHTML=`<div class="grab"></div><div class="sheet-in"><div class="sheet-m">${icon(ok?"check":"cross")}</div>
    <div class="sheet-t"><b>${title}</b><div>${detail}</div></div></div>

/* ================= tiny low-poly 3D engine (canvas 2D, painter's algorithm) ================= */
const E3={};
E3.hex=c=>{if(Array.isArray(c))return c;c=c.replace("#","");return [parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)]};
E3.rng=seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
/* primitives: {v:[[x,y,z]], f:[{i:[...], t:"side"|"top"|"bot"}]} centred on origin, y up */
E3.box=(w,h,d)=>{const x=w/2,y=h/2,z=d/2;return{v:[[-x,-y,-z],[x,-y,-z],[x,y,-z],[-x,y,-z],[-x,-y,z],[x,-y,z],[x,y,z],[-x,y,z]],
  f:[{i:[0,1,2,3],t:"side"},{i:[4,5,6,7],t:"side"},{i:[0,4,7,3],t:"side"},{i:[1,5,6,2],t:"side"},{i:[3,2,6,7],t:"top"},{i:[0,1,5,4],t:"bot"}]}};
E3.cyl=(rt,rb,h,n)=>{const v=[],f=[];for(let k=0;k<n;k++){const a=k/n*Math.PI*2;v.push([Math.cos(a)*rt,h/2,Math.sin(a)*rt])}
  for(let k=0;k<n;k++){const a=k/n*Math.PI*2;v.push([Math.cos(a)*rb,-h/2,Math.sin(a)*rb])}
  for(let k=0;k<n;k++){const k2=(k+1)%n;f.push({i:[k,k2,n+k2,n+k],t:"side"})}
  if(rt>0)f.push({i:[...Array(n).keys()],t:"top"});if(rb>0)f.push({i:[...Array(n).keys()].map(k=>n+k),t:"bot"});return{v,f}};
E3.cone=(r,h,n)=>{const v=[[0,h/2,0]],f=[];for(let k=0;k<n;k++){const a=k/n*Math.PI*2;v.push([Math.cos(a)*r,-h/2,Math.sin(a)*r])}
  for(let k=0;k<n;k++)f.push({i:[0,1+k,1+(k+1)%n],t:"side"});f.push({i:[...Array(n).keys()].map(k=>1+k),t:"bot"});return{v,f}};
E3.sphere=(r,lat,lon)=>{const v=[[0,r,0]],f=[];for(let i=1;i<lat;i++){const p=i/lat*Math.PI;for(let j=0;j<lon;j++){const a=j/lon*Math.PI*2;v.push([Math.sin(p)*Math.cos(a)*r,Math.cos(p)*r,Math.sin(p)*Math.sin(a)*r])}}
  v.push([0,-r,0]);const last=v.length-1,ring=i=>1+(i-1)*lon;
  for(let j=0;j<lon;j++)f.push({i:[0,ring(1)+j,ring(1)+(j+1)%lon],t:"side"});
  for(let i=1;i<lat-1;i++)for(let j=0;j<lon;j++){const a=ring(i)+j,b=ring(i)+(j+1)%lon,c=ring(i+1)+(j+1)%lon,d=ring(i+1)+j;f.push({i:[a,b,c,d],t:"side"})}
  for(let j=0;j<lon;j++)f.push({i:[last,ring(lat-1)+(j+1)%lon,ring(lat-1)+j],t:"side"});return{v,f}};
E3.disc=(r,n)=>{const v=[];for(let k=0;k<n;k++){const a=k/n*Math.PI*2;v.push([Math.cos(a)*r,0,Math.sin(a)*r])}return{v,f:[{i:[...Array(n).keys()],t:"top",ds:1}]}};
E3.poly=pts=>({v:pts,f:[{i:pts.map((_,k)=>k),t:"top",ds:1}]});
function rot(p,o){let [x,y,z]=p;const s=o.s||[1,1,1];x*=s[0];y*=s[1];z*=s[2];
  if(o.rz){const c=Math.cos(o.rz),n=Math.sin(o.rz);[x,y]=[x*c-y*n,x*n+y*c]}
  if(o.rx){const c=Math.cos(o.rx),n=Math.sin(o.rx);[y,z]=[y*c-z*n,y*n+z*c]}
  if(o.ry){const c=Math.cos(o.ry),n=Math.sin(o.ry);[x,z]=[x*c+z*n,-x*n+z*c]}
  const t=o.pos||[0,0,0];return [x+t[0],y+t[1],z+t[2]]}
/* add a primitive to a mesh. o: {pos,rx,ry,rz,s,c,top,side,bot,e,L} */
E3.add=(m,p,o)=>{const base=m.v.length,ctr=rot([0,0,0],o);for(const q of p.v)m.v.push(rot(q,o));
  for(const f of p.f){const col=E3.hex((f.t==="top"&&o.top)||(f.t==="bot"&&o.bot)||(f.t==="side"&&o.side)||o.c||"#cccccc");
    const ii=f.i.map(k=>k+base),a=m.v[ii[0]],b=m.v[ii[1]],c=m.v[ii[2]];
    let n=E3.nrm(E3.cross(E3.sub(b,a),E3.sub(c,a)));const fc=E3.avg(ii.map(k=>m.v[k]));if(!f.ds&&E3.dot(n,E3.sub(fc,ctr))<0)n=n.map(x=>-x);if(f.ds&&n[1]<0)n=n.map(x=>-x);
    m.f.push({i:ii,c:o.jit?E3.jit(col,o.jit):col,n,ds:!!f.ds,e:o.e||0,L:o.L??3,a:o.a??1})}return m};
E3.sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];E3.cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
E3.dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];E3.nrm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l]};
E3.avg=ps=>{let x=0,y=0,z=0;for(const p of ps){x+=p[0];y+=p[1];z+=p[2]}const n=ps.length;return [x/n,y/n,z/n]};
E3.jit=(c,a)=>{const r=(Math.random()-.5)*a;return c.map(x=>Math.max(0,Math.min(255,x+r)))};
E3.mesh=()=>({v:[],f:[]});
/* object: {m: mesh in local coords, tf:(t)=>({pos,rx,ry,rz,s}) optional} ; static objects have no tf */
E3.render=(ctx,W,H,objs,cam,env,t)=>{
  const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch),D=cam.dist,F=H*cam.fov,ox=W/2,oy=H*cam.cy;
  const L=E3.nrm(env.light),amb=env.amb,tint=env.tint,ta=env.ta||0,faces=[],glows=[];
  const view=p=>{let x=p[0],y=p[1]-cam.ty,z=p[2];[x,z]=[x*cy+z*sy,-x*sy+z*cy];[y,z]=[y*cp-z*sp,y*sp+z*cp];return [x,y,z]};
  for(const o of objs){let V=o.m.v,tr=null;if(o.tf){tr=o.tf(t);if(!tr)continue;V=V.map(p=>rot(p,tr))}
    const VV=V.map(view);
    for(const f of o.m.f){const pts=f.i.map(k=>VV[k]);let n=f.n;if(tr){n=rot(n,{rx:tr.rx,ry:tr.ry,rz:tr.rz});}
      const nv=view([n[0],n[1]+cam.ty,n[2]]);const c=E3.avg(pts);
      if(!f.ds&&E3.dot(nv,[-c[0],-c[1],D-c[2]])<=0)continue;
      let k;if(f.e&&env.night)k=1.15;else{const d=Math.max(0,E3.dot(n,L));k=amb+(1-amb)*d;if(f.ds)k=Math.max(k,amb+.25)}
      let col=f.c.map(x=>x*k);if(ta&&!(f.e&&env.night))col=col.map((x,i)=>x*(1-ta)+tint[i]*ta*k);
      faces.push({p:pts,z:c[2],L:f.L,col:f.a<1?`rgba(${col[0]|0},${col[1]|0},${col[2]|0},${f.a})`:`rgb(${col[0]|0},${col[1]|0},${col[2]|0})`,a:f.a});
      if(f.e&&env.night&&f.e>1)glows.push(c)}}
  faces.sort((a,b)=>a.L-b.L||a.z-b.z);
  const pr=p=>{const s=F/(D-p[2]);return [ox+p[0]*s,oy-p[1]*s]};
  ctx.lineJoin="round";
  for(const f of faces){ctx.beginPath();f.p.forEach((p,i)=>{const [x,y]=pr(p);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fillStyle=f.col;ctx.fill();if(f.a>=1){ctx.strokeStyle=f.col;ctx.lineWidth=.7;ctx.stroke()}}
  for(const g of glows){const [x,y]=pr(g),r=F/(D-g[2])*.28;const gr=ctx.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,"rgba(255,226,140,.42)");gr.addColorStop(1,"rgba(255,226,140,0)");ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
  return {project:p=>pr(view(p)),faces:faces.length};

let TR=null;
const TLEN={short:{name:"輕量",r:8,nw:5,quiz:5,listen:2,build:2},std:{name:"標準",r:15,nw:10,quiz:10,listen:4,build:3},long:{name:"加強",r:25,nw:15,quiz:15,listen:6,build:5}};
const TL=()=>TLEN[S.tlen]||TLEN.std;
function trainPlan(){
  const L=TL(),act=ACTIVE(),r=Math.min(dueReviews(act).length,L.r),nw=Math.min(act.filter(w=>srs(w.id).box===0).length,L.nw),n=Math.max(1,r+nw);
  return [{k:"cards",n,r,nw,label:r&&nw?`複習 ${r} 個 · 新字 ${nw} 個`:r?`複習到期單字 ${r} 個`:`認識新單字 ${nw||n} 個`},
          {k:"quiz",n:L.quiz,label:`弱點測驗 ${L.quiz} 題`},{k:"listen",n:L.listen,label:`聽寫 ${L.listen} 句`},{k:"build",n:L.build,label:`造句 ${L.build} 句`}]}
const tdToday=()=>S.td[today()]||{done:[]};
const minutesOf=p=>Math.max(3,Math.round(p.reduce((a,s)=>a+({cards:.4,quiz:.35,listen:1.2,build:.8}[s.k])*s.n,0)));
function startTraining(){ROOT=false;
  const plan=trainPlan();let t=tdToday();
  if(plan.every(s=>t.done.includes(s.k))){S.td[today()]={done:[],bonus:t.bonus};save();t=tdToday()}
  TR={plan,i:plan.findIndex(s=>!t.done.includes(s.k))};enter("home");runStep();
}
function runStep(){const s=TR.plan[TR.i],end=stepDone;
  if(s.k==="cards"){const act=ACTIVE();let d=shuffle(dueReviews(act)).sort((a,b)=>srs(a.id).box-srs(b.id).box).slice(0,s.r||0);
    d=d.concat(shuffle(act.filter(w=>srs(w.id).box===0)).slice(0,s.nw||0));if(!d.length)d=shuffle(act).slice(0,s.n);runCards(shuffle(d),"單字卡",end)}
  else if(s.k==="quiz")runQuiz({total:s.n,types:["en","zh","ex"],onEnd:end});
  else if(s.k==="listen")runListen({n:s.n,onEnd:end});
  else runBuild({n:s.n,onEnd:end});
}
function trainBar(){if(!TR)return"";const done=tdToday().done;
  return `<div class="trainbar"><span>今日訓練 · 第 ${TR.i+1} / ${TR.plan.length} 步</span><button class="link" onclick="go('home')">離開</button></div>
  <div class="steps">${TR.plan.map((s,i)=>`<i class="${done.includes(s.k)?"on":i===TR.i?"cur":""}"></i>`).join("")}</div>`}
function stepDone(){
  const t=S.td[today()]=S.td[today()]||{done:[]};const s=TR.plan[TR.i];if(!t.done.includes(s.k)){t.done.push(s.k);earn(0,5)}save();
  const next=TR.plan.findIndex(x=>!t.done.includes(x.k));
  if(next<0){const first=!t.bonus;if(first){t.bonus=1;S.boxes=(S.boxes||0)+1;save()}TR=null;
    view().innerHTML=`<div class="stack finish"><div class="fin-rings">${rings(ringVals(),150,"anim")}</div><h2 style="margin:0">今日訓練完成</h2>
      <p class="sub" style="margin:0">${first?"獲得 30 XP 和一個驚喜盒。":"這是今天的加練，做得好。"}</p>
      ${(S.boxes||0)>0?`<button class="btn primary cta" id="openBox" style="width:100%">打開驚喜盒${S.boxes>1?`（${S.boxes}）`:""}</button>`:""}
      <div class="row"><button class="btn" onclick="go('weak')">看學習分析</button><button class="btn" onclick="go('home')">回首頁</button></div></div>`;
    if(first)gainXP(30);burst(.3);sfx("level");
    const ob=$("#openBox");if(ob)ob.onclick=()=>mysteryBox("今日訓練獎勵",()=>{ob.remove()});
    checkAch();return}
  TR.i=next;const n=TR.plan[next];sfx("ok");
  view().innerHTML=`${trainBar()}<div class="stack inter"><div class="label">已完成 ${t.done.length} / ${TR.plan.length}</div>
    <div class="inter-next">下一項：${n.label}</div>
    <button class="btn primary cta" id="goNext">繼續<span aria-hidden="true">→</span></button>
    <button class="link" onclick="go('home')" style="align-self:flex-start">先休息，等等再做</button></div>`;
  $("#goNext").onclick=runStep;
}

  <div id="fb" hidden></div>`;
  if(speakFirst)say(speakFirst);
  let answered=false;

let LS=null;

function runListen(o){ROOT=false;LS={n:o.n||Infinity,i:0,onEnd:o.onEnd};nextListen()}

  $("#hint").onclick=()=>{$("#hintBox").hidden=false};

      else{out.push(`<span class="need">${esc(target[i])}</span>`);i++}}
    const pct=Math.round(L[0][0]/m*100),res=pct>=90?2:pct>=60?1:0;
    review(lt.id,res,"listen",$("#chk"));sfx(res===2?"ok":"bad");
    $("#res").innerHTML=`<div class="big" style="font-size:2rem;margin:6px 0">${pct}% <small>${pct===100?"Perfect!":pct>=90?"Great ears!":pct>=60?"Getting there.":"Try again!"}</small></div>
      <div class="diff">${out.join(" ")}</div>

    $("#nx").onclick=()=>{LS.i++;nextListen()}}
}

function accSum(days){const out={};Object.keys(SKILLS).forEach(k=>out[k]=[0,0]);const d=new Date();
  for(let i=0;i<days;i++){const a=S.accd[dkey(d)];if(a)for(const k in a)if(out[k]){out[k][0]+=a[k][0];out[k][1]+=a[k][1]}d.setDate(d.getDate()-1)}return out}
function weak(){
  enter("weak");ROOT=true;
  const act=ACTIVE(),st=[0,0,0,0];act.forEach(w=>st[stageOf(srs(w.id).box)]++);
  const wk7=Object.values(S.mt).filter(d=>(Date.now()-new Date(d+"T00:00").getTime())<7*864e5).length;
  const acc=accSum(14),total=Object.values(acc).reduce((a,x)=>a+x[1],0);
  const rated=Object.entries(acc).filter(([,x])=>x[1]>=5).map(([k,x])=>[k,x[0]/x[1]]).sort((a,b)=>a[1]-b[1]);
  const wl=weakList(),byScene={};wl.forEach(w=>byScene[w.cat]=(byScene[w.cat]||0)+1);
  const worstScene=Object.entries(byScene).sort((a,b)=>b[1]-a[1])[0];
  const TIP={rec:"多做單字卡，先把常見字認熟",recall:"多做中翻英和填空，練習自己想出單字",listen:"每天多聽寫幾句，聽不清楚就先用慢速",build:"多練造句，特別注意詞序"};
  let advice;
  if(total<10)advice="先完成幾次今日訓練。累積 10 題以上的作答紀錄後，這裡會告訴你該加強什麼。";
  else{const parts=[];if(rated.length&&rated[0][1]<0.85)parts.push(`你的${SKILLS[rated[0][0]]}最弱（${Math.round(rated[0][1]*100)}%），建議${TIP[rated[0][0]]}`);
    if(worstScene)parts.push(`錯題最多的是「${SCENES[worstScene[0]][0]}」，可以先做錯題特訓`);
    advice=parts.length?parts.join("。")+"。":"各項表現都很穩定。可以到設定把程度調高，挑戰更難的字。"}
  const pct=n=>act.length?n/act.length*100:0;
  view().innerHTML=`<h2>弱點分析</h2><p class="sub">依照你的作答紀錄，看出哪些字真的會、哪些只是眼熟。</p>
  <div class="stack">
    <section class="advice"><div><div class="label">下一步建議</div><div>${advice}</div></div></section>
    <section>
      <div class="sec-h"><span>單字掌握</span><span class="note">本週新掌握 +${wk7}</span></div>
      <div class="stagebar">${st.map((n,i)=>n?`<i class="s${i}" style="width:${pct(n)}%"></i>`:"").join("")}</div>
      <div class="legend">${STAGES.map((s,i)=>`<span><i class="s${i}"></i>${s} <b>${st[i]}</b></span>`).join("")}</div>
      <p class="note">「已掌握」代表隔了 7 天以上還記得。四選一猜對最多只會把新字變成「學習中」。</p>
    </section>
    <section>
      <div class="sec-h"><span>能力表現</span><span class="note">最近 14 天</span></div>
      <div class="skills">${Object.entries(SKILLS).map(([k,n])=>{const [o,t]=acc[k],p=t?Math.round(o/t*100):0;
        return `<div class="skill"><span class="sk-n">${n}</span><span class="sk-bar"><i class="${t>=5&&p<70?"low":""}" style="width:${t>=5?p:0}%"></i></span><span class="sk-v">${t>=5?p+"%":t?"資料不足":"—"}</span></div>`}).join("")}</div>
      <p class="note">認字＝看英文選中文　回想＝中翻英、填空、單字卡　聽力＝聽寫　造句＝排句子</p>
    </section>
    <section>
      <div class="sec-h"><span>錯題本 · ${wl.length}</span>${wl.length?`<button class="link" onclick="weakDrill()">錯題特訓</button>`:""}</div>
      ${wl.length?`<div class="list">${wl.slice(0,30).map(w=>{const k=S.wk[w.id];
        return `<div class="it"><div style="min-width:0"><b>${esc(w.w)}</b> <span class="m">${esc(w.zh)}</span>
          <div class="wtags">${Object.entries(k.s).map(([s,n])=>`<span class="wtag ${s===k.last?"last":""}">${SKILLS[s]||s} ×${n}</span>`).join("")}</div></div>
          <span class="note" title="要在不同的兩天答對才會移出">${k.ok}/2 天</span></div>`}).join("")}</div>
        <p class="note">要在答錯之後的不同兩天都答對，才會移出錯題本。深色標籤是最近一次錯的地方。</p>`
      :`<p class="note">目前沒有錯題。答錯、按「忘了」、聽寫低於 60% 或造句排錯的字會出現在這裡。</p>`}
    </section>
  </div>`;
}

/* ================= WORD BANK ================= */
let q="",listCat="all",delArmed=null;
function bank(){
  enter("bank");ROOT=true;
  const sceneTiles=Object.entries(SCENES).map(([k,[zh,en]])=>{const ws=ALL().filter(w=>w.cat===k),m=ws.filter(w=>isMastered(w.id)).length;
    return `<div class="scene ${S.cats.includes(k)?"on":""}" data-sc="${k}" style="--sc:${SC[k]}">
      <button class="scene-main" data-open="${k}" aria-label="查看${zh}的單字"><span class="scene-ic">${icon(k)}</span><span class="scene-en">${en}</span><span class="scene-zh">${zh}</span>
      <span class="scene-n">${ws.length} 字${ws.length?` · 掌握 ${m}`:""}</span><span class="scene-bar"><i style="width:${ws.length?m/ws.length*100:0}%"></i></span></button>
      <button class="scene-tog" data-cat="${k}" aria-pressed="${S.cats.includes(k)}" aria-label="${zh}加入練習">${S.cats.includes(k)?"練習中":"未選"}</button></div>`}).join("");
  view().innerHTML=`<h2>單字庫</h2><p class="sub">共 ${ALL().length} 個字，依使用場景分類。點場景看單字，右下角切換要不要放進練習。目前程度：${lvName()}，超出程度的字會先跳過。</p>
  <div class="stack">
    <div class="seg"><span class="label" id="scLabel">練習範圍 · ${S.cats.length} 個場景</span><button class="link" id="allOn">全選</button></div>
    <div class="scenes" id="cats">${sceneTiles}</div>
    <div class="hr"></div>
    <details id="addBox"><summary>新增我的單字</summary><div class="body">
      <form id="addForm" class="stack" style="gap:12px">
        <div class="field"><label for="nw">英文單字或片語（必填）</label><input type="text" id="nw" autocomplete="off" autocapitalize="off" required></div>
        <div class="field"><label for="nz">中文意思（必填）</label><input type="text" id="nz" autocomplete="off" required></div>
        <div class="field"><label for="ne">英文例句（選填，有例句才會出現在聽寫和造句）</label><input type="text" id="ne" autocomplete="off" autocapitalize="sentences"></div>
        <div class="field"><label for="nez">例句中文（選填）</label><input type="text" id="nez" autocomplete="off"></div>
        <button class="btn primary" type="submit">加入單字庫</button>
        <div id="addMsg" class="note"></div>
      </form>
    </div></details>
    <div class="hr"></div>
    <div id="listHead" class="field"><label for="search">搜尋單字</label><input type="text" id="search" value="${esc(q)}" placeholder="英文或中文" autocomplete="off" autocapitalize="off"></div>
    <div class="filters" id="lcat">${[["all","全部"],...Object.entries(CATS)].map(([k,l])=>`<button data-l="${k}" aria-pressed="${listCat===k}">${l}</button>`).join("")}</div>
    <div class="list" id="wl"></div>
  </div>`;
  const syncL=()=>view().querySelectorAll("#lcat button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.l===listCat));
  $("#cats").onclick=e=>{const o=e.target.closest("[data-open]");
    if(o){listCat=o.dataset.open;q="";$("#search").value="";syncL();drawList();$("#listHead").scrollIntoView({behavior:reduce?"auto":"smooth",block:"start"});return}
    const b=e.target.closest("[data-cat]");if(!b)return;const k=b.dataset.cat;
    if(S.cats.includes(k)){if(S.cats.length>1)S.cats=S.cats.filter(x=>x!==k);else{toast("至少要選一個場景");return}}else S.cats.push(k);save();
    const on=S.cats.includes(k);b.setAttribute("aria-pressed",on);b.textContent=on?"練習中":"未選";b.parentElement.classList.toggle("on",on);
    $("#scLabel").textContent=`練習範圍 · ${S.cats.length} 個場景`};
  $("#allOn").onclick=()=>{S.cats=Object.keys(SCENES);save();bank()};
  $("#lcat").onclick=e=>{const b=e.target.closest("[data-l]");if(!b)return;listCat=b.dataset.l;syncL();drawList()};
  $("#search").oninput=e=>{q=e.target.value;drawList()};
  $("#addForm").onsubmit=e=>{e.preventDefault();const w=$("#nw").value.trim(),z=$("#nz").value.trim();
    if(!w||!z){$("#addMsg").textContent="請填寫英文和中文。";return}
    if(ALL().some(x=>x.w.toLowerCase()===w.toLowerCase())){$("#addMsg").textContent=`「${w}」已經在單字庫裡了。`;return}
    S.custom.push({id:"c"+Date.now(),w,zh:z,ipa:"",pos:"",lvl:"",ex:$("#ne").value.trim(),exZh:$("#nez").value.trim(),cat:"c"});
    if(!S.cats.includes("c"))S.cats.push("c");save();
    ["#nw","#nz","#ne","#nez"].forEach(s=>$(s).value="");$("#addMsg").textContent=`已加入「${w}」，會出現在單字卡複習。`;say(w);
    drawList();$("#nw").focus();checkAch()};
  drawList();
}
function drawList(){
  const k=q.trim().toLowerCase();
  let list=ALL().filter(w=>(listCat==="all"||w.cat===listCat)&&(!k||w.w.toLowerCase().includes(k)||w.zh.includes(k)));
  if(listCat==="all"&&!k)list=list.slice(0,60);
  const only=listCat!=="all"&&ALL().some(w=>w.cat===listCat)?`<div class="seg" style="padding:8px 0"><span class="note">${SCENES[listCat][1]}</span><button class="link" id="onlyThis">只練這個場景</button></div>`:"";
  $("#wl").innerHTML=only+(list.length?list.map(w=>{const b=srs(w.id).box,out=!inLevel(w);
    return `<div class="it ${out?"out":""}"><div style="min-width:0"><b>${esc(w.w)}</b> <span class="ipa">${esc(w.ipa)}</span>${out?` <span class="lvtag">${w.lvl}</span>`:""}<div class="m">${esc(w.zh)}</div>
      ${w.cat==="c"?`<button class="link danger" data-del="${w.id}">${delArmed===w.id?"確定刪除？":"刪除"}</button>`:""}</div>
      <div class="row" style="align-items:center;gap:6px;flex-wrap:nowrap">${spkBtn(w.w)}<span class="stage s${stageOf(b)}">${STAGES[stageOf(b)]}</span></div></div>`}).join("")
    +(listCat==="all"&&!k&&ALL().length>60?`<p class="note">只顯示前 60 個，用搜尋或分類找其他字。</p>`:"")
    :`<p class="note">${listCat==="c"&&!k?"還沒有自己的單字，用上面的「新增我的單字」加入。":"找不到符合的單字。"}</p>`);
  if($("#onlyThis"))$("#onlyThis").onclick=()=>{S.cats=[listCat];save();toast(`只練「${SCENES[listCat][0]}」`);cur="practice";renderTabs();freeCards()};
  $("#wl").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const id=b.dataset.del;
    if(delArmed!==id){delArmed=id;drawList();return}
    S.custom=S.custom.filter(x=>x.id!==id);delete S.srs[id];delete S.wk[id];delArmed=null;save();drawList()});
}

/* ================= ONBOARDING ================= */
let OB={lvl:null,cats:null};
function onboarding(step){ROOT=false;
  document.body.classList.add("onb");
  if(step===1){
    view().innerHTML=`<div class="stack onbw"><div class="inter-pet">${mascot({demo:true,size:96})}<div class="bubble">每天完成三個圓環：答題、今日訓練、新學的字。</div></div><div><div class="label">設定 1 / 2</div><h2 style="margin-top:6px">你的英文程度？</h2>
      <p class="sub" style="margin:0">App 會先從這個程度以下的字開始，之後可以在設定改。</p></div>
      <div class="stack" style="gap:10px">${LEVELS.map(([k,n,d,ex])=>`<button class="mode ${S.lvl===k&&S.onb?"sel":""}" data-lv="${k}"><span class="mode-t">${n}</span><span class="mode-d">${d}</span><span class="mode-ex">${ex}</span></button>`).join("")}</div></div>`;
    view().querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{OB.lvl=b.dataset.lv;onboarding(2)});
  }else{
    OB.cats=OB.cats||(S.onb||Object.keys(S.srs).length?S.cats.slice():["food","shop","move","trip","social","home"]);
    const draw=()=>{view().innerHTML=`<div class="stack onbw"><div><div class="label">設定 2 / 2</div><h2 style="margin-top:6px">你最想用英文做什麼？</h2>
      <p class="sub" style="margin:0">可以多選，之後在單字庫隨時調整。</p></div>
      <div class="filters big-chips">${Object.entries(SCENES).filter(([k])=>k!=="c").map(([k,[zh]])=>`<button data-c="${k}" aria-pressed="${OB.cats.includes(k)}">${zh}</button>`).join("")}</div>
      <button class="btn primary cta" id="obGo" ${OB.cats.length?"":"disabled"}>開始學習<span aria-hidden="true">→</span></button>
      <button class="link" id="obBack" style="align-self:flex-start">← 回上一步</button></div>`;
      view().querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{const k=b.dataset.c;OB.cats=OB.cats.includes(k)?OB.cats.filter(x=>x!==k):OB.cats.concat(k);draw()});
      $("#obBack").onclick=()=>onboarding(1);
      $("#obGo").onclick=()=>{S.lvl=OB.lvl||S.lvl;S.cats=OB.cats.concat(S.custom.length?["c"]:[]);S.onb=true;save();document.body.classList.remove("onb");home();toast(`已設定：${lvName()} · ${OB.cats.length} 個場景`)}};
    draw();
  }
}

applyTheme();mountAura();applyBg();useFreezes();setInterval(()=>renderHeader(),30000);$("#flameI").innerHTML=FLAME;$("#coinI").innerHTML=COIN;$("#coinChip").onclick=()=>shop();
renderTabs();renderHeader();
if(!S.onb)onboarding(1);else home();
checkAch();cloudInit();
</script>
