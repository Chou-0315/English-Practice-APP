.finish-mark{width:64px;height:64px;border-radius:50%;background:var(--good);color:var(--bg);display:grid;place-items:center;font-size:1.8rem}
.train{display:flex;flex-direction:column;gap:12px;border:1px solid var(--line);border-radius:22px;padding:16px 16px 14px}
.train .sec-h{margin:0}
.tsteps{display:flex;flex-direction:column;gap:8px}
.tstep{display:flex;align-items:center;gap:12px;font-size:.92rem}
.tstep .qc{grid-row:auto;font-size:.72rem;color:var(--muted)}
.tstep.ok .qc{background:var(--good);box-shadow:none;color:var(--bg)}
.tstep.ok span:last-child{color:var(--muted);text-decoration:line-through}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mode:disabled{opacity:.45;cursor:default}
.mode.warn{border-color:var(--bad)} .mode.warn .mode-t{color:var(--bad)}
.mode.sel{border-color:var(--ink)}
.mode-ex{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);margin-top:4px}
.stage{font-size:.72rem;padding:1px 8px;border-radius:99px;white-space:nowrap;background:var(--soft);color:var(--muted)}
.stage.s1{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.stage.s2{background:color-mix(in srgb,var(--gold) 30%,transparent);color:var(--gold-ink)}
.stage.s3{background:var(--good);color:var(--bg)}
:root[data-theme="dark"] .stage.s2{color:var(--gold)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .stage.s2{color:var(--gold)}}
.advice{background:var(--soft);border-radius:18px;padding:16px;display:flex;flex-direction:column;gap:6px;font-size:.95rem}
.stagebar{display:flex;height:12px;border-radius:99px;overflow:hidden;background:var(--line);gap:2px}
.stagebar i,.legend i{display:block}
.stagebar i.s0,.legend i.s0{background:var(--line)}
.stagebar i.s1,.legend i.s1{background:var(--accent)}
.stagebar i.s2,.legend i.s2{background:var(--gold)}
.stagebar i.s3,.legend i.s3{background:var(--good)}
.stagebar i.s0{background:color-mix(in srgb,var(--muted) 30%,transparent)}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:10px;font-size:.82rem;color:var(--muted)}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:8px;height:8px;border-radius:50%}
.legend i.s0{background:color-mix(in srgb,var(--muted) 30%,transparent)}
.legend b{color:var(--ink);font-weight:500;font-variant-numeric:tabular-nums}
.skills{display:flex;flex-direction:column;gap:10px}
.skill{display:grid;grid-template-columns:3em 1fr 4.5em;gap:12px;align-items:center;font-size:.9rem}
.sk-bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.sk-bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.sk-bar i.low{background:var(--bad)}
.sk-v{text-align:right;font-variant-numeric:tabular-nums;color:var(--muted);font-size:.82rem}
.wtags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.wtag{font-size:.7rem;padding:1px 7px;border-radius:99px;border:1px solid var(--line);color:var(--muted)}
.wtag.last{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.it.out{opacity:.5}
.lvtag{font-size:.68rem;border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted)}
.onbw{margin-top:24px;gap:20px}
.big-chips button{font-size:.95rem;padding:9px 16px}
@media (max-width:360px){.modes{grid-template-columns:1fr}}
.syncline{display:flex;gap:8px;align-items:flex-start}
.sdot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none;margin-top:6px}
.syncline:has(.sync-ok) .sdot{background:var(--good)}
.syncline:has(.sync-err) .sdot,.syncline:has(.sync-ro) .sdot{background:var(--bad)}
/* ===== SYSTEM-APP STYLE: grouped inset lists, large titles, activity rings, translucent bars ===== */
body{font-family:var(--f-body);background:var(--bg);color:var(--ink);font-size:17px;line-height:1.4;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
.app{max-width:560px}
main{padding:0 16px 110px}
h2{font-family:var(--f-disp);font-weight:700;font-size:2.125rem;letter-spacing:.005em;line-height:1.15;margin:14px 0 10px}
.sub{color:var(--muted);font-size:.94rem;margin:0 0 18px;line-height:1.45}
.label,.kind{font-size:.8rem;color:var(--muted);font-weight:500;letter-spacing:0;text-transform:none;font-family:var(--f-body)}
.note{color:var(--muted);font-size:.8rem}
.ic{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.chev{width:13px;height:13px;stroke-width:2.6;color:var(--chev)}
.ic.flip{transform:rotate(180deg)}
/* header (compact nav bar) */
header{padding:10px 16px 2px;gap:4px}
header h1{font-family:var(--f-body);font-weight:600;font-size:.82rem;color:var(--muted);letter-spacing:0}
.chips{display:flex;gap:12px;align-items:center}
.chip-s{display:inline-flex;align-items:center;gap:4px;background:none;border:0;padding:0;font:inherit;font-weight:600;font-size:.88rem;color:var(--ink);cursor:pointer;font-variant-numeric:tabular-nums}
.chip-s svg{width:17px;height:17px}
.lv{gap:8px}
.lv b{font-weight:600;font-size:.72rem;color:var(--muted);font-family:var(--f-body)}
.lv span{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}
.lvtrack{height:4px;border-radius:2px;background:var(--fill)}
.lvtrack i{background:var(--accent);border-radius:2px}
/* tab bar */
nav{background:var(--bar);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-top:.5px solid var(--sep);box-shadow:none;border-radius:0;padding:5px 8px calc(4px + env(safe-area-inset-bottom,0px))}
nav button{font-size:.62rem;font-weight:500;gap:2px;padding:2px;color:var(--chev);letter-spacing:0}
nav button svg{width:25px;height:25px;stroke-width:1.7}
nav button[aria-current="true"]{color:var(--accent)}
nav button[aria-current="true"] svg{stroke-width:2.2}
/* buttons */
.btn{border:0;background:var(--tint);color:var(--accent);border-radius:12px;font-weight:600;font-size:1.0625rem;padding:14px 16px;box-shadow:none;transition:opacity .12s}
.btn:active:not(:disabled){opacity:.6;transform:none;box-shadow:none}
.btn.primary{background:var(--accent);color:#fff}
.btn:disabled{opacity:.35}
.btn.good{background:color-mix(in srgb,var(--good) 16%,transparent);color:var(--good)}
.btn.bad{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.btn.meh{background:color-mix(in srgb,#FF9500 16%,transparent);color:#FF9500}
.cta{display:flex;justify-content:center;align-items:center;font-size:1.0625rem;font-weight:600;padding:15px 20px;border-radius:14px;font-family:var(--f-body)}
.link{color:var(--accent);font-weight:400;font-size:.95rem}
.back{display:inline-flex;align-items:center;gap:4px;color:var(--accent);font-size:1.0625rem;font-weight:400;margin:10px 0 0 -4px;letter-spacing:0;text-transform:none;font-family:var(--f-body)}
.back .ic{width:16px;height:16px;stroke-width:2.6;color:var(--accent)}
/* grouped lists */
.group{background:var(--surface);border-radius:12px;overflow:hidden}
.grow{display:flex;align-items:center;gap:12px;width:100%;min-height:46px;padding:9px 16px;border:0;background:none;font:inherit;color:var(--ink);text-align:left;position:relative;box-sizing:border-box}
button.grow{cursor:pointer}
button.grow:active{background:var(--press)}
.grow+.grow::before{content:"";position:absolute;top:0;right:0;left:58px;height:.5px;background:var(--sep)}
.group > .grow:first-child::before{content:none}
.grow-l{flex:1;min-width:0;display:flex;flex-direction:column}
.grow-l b{font-weight:400;font-size:1.0625rem}
.grow-l small{font-size:.8rem;color:var(--muted)}
.grow-r{display:flex;align-items:center;gap:6px;color:var(--muted);font-size:1rem;font-variant-numeric:tabular-nums}
.grow-r b{font-weight:400;color:var(--muted)}
.grow-r .coin{width:17px;height:17px}
.sq{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;flex:none;color:#fff}
.sq .ic{width:18px;height:18px;stroke-width:2}
.trow.ok .grow-l b{color:var(--muted)}
.trow.cur .grow-l small{color:var(--accent);font-weight:500}
.trow:not(.cur){cursor:default}
.okc{width:22px;height:22px;border-radius:50%;background:var(--good);display:grid;place-items:center;color:#fff}
.okc .ic{width:13px;height:13px;stroke-width:3}
.ghead{display:flex;justify-content:space-between;align-items:baseline;font-size:.8rem;color:var(--muted);padding:0 16px 7px;text-transform:uppercase;letter-spacing:.02em}
.foot{font-size:.8rem;color:var(--muted);padding:7px 16px 0;margin:0 0 22px;line-height:1.45}
/* home */
.home{gap:22px;margin-top:0}
.ltitle{display:flex;flex-direction:column;margin-bottom:-14px}
.ltitle .eyebrow{font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;margin-top:12px}
.ltitle h2{margin:0}
.ringcard{background:var(--surface);border-radius:20px;padding:18px 18px 16px;display:grid;grid-template-columns:auto 1fr;gap:14px 20px;align-items:center}
.rc-rings{background:none;border:0;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent;line-height:0}
.rings .rg{transition:stroke-dashoffset 1s cubic-bezier(.3,.8,.2,1)}
.rc-legend{display:flex;flex-direction:column;gap:8px}
.rl span{display:block;font-size:.82rem;font-weight:600}
.rl b{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;letter-spacing:-.01em}
.rl small{font-size:.9rem;font-weight:600;margin-left:2px}
.rl.r1 span,.rl.r1 b{color:var(--ring1)} .rl.r2 span,.rl.r2 b{color:var(--ring2)} .rl.r3 span,.rl.r3 b{color:var(--ring3)}
.rc-tip{grid-column:1/-1;font-size:.94rem;color:var(--ink);border-top:.5px solid var(--sep);padding-top:12px}
.ringcard .week{grid-column:1/-1;margin-top:0}
.dn{font-size:.68rem;color:var(--muted);font-weight:600;opacity:1;font-family:var(--f-body)}
.dot{width:26px;height:26px;background:var(--fill);box-shadow:none;font-size:.7rem;color:var(--muted)}
.day.done .dot{background:var(--accent);color:#fff;box-shadow:none}
.day.full .dot{background:var(--ring1);color:#fff;box-shadow:none}
.day.today:not(.done) .dot{box-shadow:inset 0 0 0 2px var(--accent)}
.day.today .dn{color:var(--accent)}
.train{display:flex;flex-direction:column;gap:12px;background:none;border:0;padding:0;box-shadow:none;border-radius:0}
.train .ghead{margin-bottom:-5px}
.award{display:block}
.award .aw-o{fill:none;stroke:var(--fill);stroke-width:4}
.award .aw-i{fill:var(--fill)}
.award .aw-q{font-size:17px;font-weight:700;fill:var(--muted);font-family:var(--f-body)}
.award.on .aw-o{stroke:var(--accent);stroke-opacity:.35}
.award.on .aw-i{fill:var(--accent)}
.award.sm{width:30px;height:30px;flex:none}
.chest-big{background:none;border:0;cursor:pointer;padding:0;animation:none}
.chest-big .award{width:160px;height:160px}
.chest-big.popped .award{animation:pop .5s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{0%{transform:scale(.6)}100%{transform:scale(1)}}
.chest-msg{display:flex;align-items:center;gap:6px;font-size:1.0625rem;font-weight:600;min-height:1.6em;font-family:var(--f-body)}
.chest-msg .coin{width:20px;height:20px}
.dotsep{color:var(--muted);margin:0 4px}
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:0;background:var(--surface);border-radius:12px;overflow:hidden;border:0}
.tiles .tile{border:0;border-radius:0;background:none;box-shadow:none;padding:12px 16px;align-items:flex-start}
.tiles .tile+.tile{border-left:.5px solid var(--sep);padding-left:16px}
.tile b{font-size:1.6rem;font-weight:700;color:var(--ink);font-family:var(--f-disp)}
.tile span{font-size:.78rem;color:var(--muted);font-family:var(--f-body);letter-spacing:0}
.tile.t-blue b{color:var(--accent)} .tile.t-green b{color:var(--good)}
.tile.warn{background:none;box-shadow:none} .tile.warn b,.tile.warn span{color:var(--bad)}
.wotd2{background:var(--surface);color:var(--ink);border:0;border-radius:20px;padding:18px;box-shadow:none}
.wotd2 .tagline{display:inline-flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;font-family:var(--f-body)}
.wotd2 .tagline .ic{color:var(--sc);width:16px;height:16px}
.wotd2 .w{font-family:var(--f-disp);font-weight:700;font-size:2.25rem;font-style:normal;margin-top:4px}
.wotd2 .ipa,.wotd2 .pos{color:var(--muted);opacity:1}
.ipa{font-family:var(--f-mono);font-size:.88rem}
.ex2{border-top:.5px solid var(--sep);font-family:var(--f-body);font-size:1rem}
.ex2 .zh{color:var(--muted);opacity:1}
.speak{width:34px;height:34px;color:var(--accent);background:var(--tint);border:0}
.speak:hover{background:var(--tint);color:var(--accent)}
.wotd2 .speak{color:var(--accent);background:var(--tint);border:0}
.more{display:flex;flex-direction:column;gap:12px;margin-top:0}
details{border:0;background:var(--surface);border-radius:12px;padding:0 16px}
details summary{padding:12px 0;font-weight:400;font-size:1.0625rem}
details summary::after{content:"";width:8px;height:8px;border-right:2.4px solid var(--chev);border-bottom:2.4px solid var(--chev);transform:rotate(-45deg);margin:6px 4px 0 0;transition:transform .2s}
details[open] summary::after{content:"";transform:rotate(45deg)}
details .body{padding:4px 0 14px;border-top:.5px solid var(--sep)}
.syncline{padding:0 16px}
.sdot{margin-top:5px}
/* segmented controls */
.rate{background:var(--fill);border-radius:9px;padding:2px;gap:0}
.rate button{border-radius:7px;padding:5px 12px;font-size:.82rem;color:var(--ink);font-weight:500}
.rate button[aria-pressed="true"]{background:var(--seg);color:var(--ink);box-shadow:0 3px 8px rgba(0,0,0,.12),0 0 0 .5px rgba(0,0,0,.04)}
/* training steps bar */
.trainbar{font-size:.8rem;color:var(--muted);font-family:var(--f-body);text-transform:none;letter-spacing:0;margin-top:10px}
.trainbar .link{font-size:.95rem}
.steps{gap:4px}
.steps i{height:4px;border-radius:2px;background:var(--fill)}
.steps i.on{background:var(--good)} .steps i.cur{background:var(--accent)}
.inter{margin-top:30px}
.inter-next{font-family:var(--f-disp);font-size:1.75rem;font-weight:700;font-style:normal}
.finish{align-items:center;text-align:center;margin-top:30px}
.finish .row{width:100%}
/* flashcards */
.card{background:var(--surface);border:0;border-radius:22px;padding:18px 20px 22px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.06);min-height:340px;justify-content:flex-start}
.card-band{display:flex;align-items:center;gap:8px;background:none;color:var(--muted);padding:0;font-size:.8rem;font-weight:600;align-self:stretch;font-family:var(--f-body);letter-spacing:0;border-radius:0}
.card-band .ic{color:var(--sc)}
.card-band .stage{margin-left:auto}
.card .w{font-family:var(--f-disp);font-weight:700;font-size:2.6rem;margin-top:28px;letter-spacing:-.01em}
.card .meaning{font-weight:600;font-size:1.3rem;color:var(--ink);border-top:.5px solid var(--sep);padding-top:14px;font-family:var(--f-body)}
.card .ex{font-family:var(--f-body)}
.hint{margin-top:auto;padding-top:20px;font-size:.88rem;color:var(--muted)}
.progress{height:4px;border-radius:2px;background:var(--fill);margin-bottom:16px}
.progress i{background:var(--accent);border-radius:2px;box-shadow:none}
.stage{font-size:.7rem;font-weight:600;padding:2px 8px;border-radius:99px;border:0;background:var(--fill)!important;color:var(--muted)!important;font-family:var(--f-body)}
.stage.s1{background:color-mix(in srgb,var(--accent) 14%,transparent)!important;color:var(--accent)!important}
.stage.s2{background:color-mix(in srgb,#FF9500 16%,transparent)!important;color:#FF9500!important}
.stage.s3{background:color-mix(in srgb,var(--good) 16%,transparent)!important;color:var(--good)!important}
/* quiz */
.q{font-family:var(--f-disp);font-weight:700;font-size:2.125rem;letter-spacing:-.005em}
.kind{color:var(--accent);font-weight:600;font-size:.82rem}
.opts{gap:10px}
.opt{border:0;border-radius:14px;background:var(--surface);box-shadow:none;padding:15px 16px;font-size:1.0625rem;transition:background .15s}
.opt:active{background:var(--press);transform:none;box-shadow:none}
.opt.right{background:color-mix(in srgb,var(--good) 16%,var(--surface));color:var(--ink);box-shadow:inset 0 0 0 2px var(--good)}
.opt.wrong{background:color-mix(in srgb,var(--bad) 13%,var(--surface));color:var(--ink);box-shadow:inset 0 0 0 2px var(--bad)}
.combo{background:color-mix(in srgb,#FF9500 16%,transparent);color:#FF9500;border:0;font-weight:600;font-family:var(--f-body)}
.result-row{display:flex;align-items:center;gap:14px}
.result-row h2{margin:0}
.big{font-family:var(--f-disp);font-weight:700}
/* bottom sheet */
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);padding:8px 20px calc(18px + env(safe-area-inset-bottom,0px));border-radius:16px 16px 0 0;box-shadow:0 -10px 40px rgba(0,0,0,.14);transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.9,.25,1);display:flex;flex-direction:column;gap:14px;max-width:560px;margin:0 auto;border:0}
.sheet.in{transform:none}
.sheet.ok,.sheet.no{color:var(--ink);background:var(--surface)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--fill);margin:0 auto 4px}
.sheet-in{display:flex;gap:12px;align-items:center}
.sheet-m{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;border:0;color:#fff}
.sheet.ok .sheet-m{background:var(--good)} .sheet.no .sheet-m{background:var(--bad)}
.sheet-m .ic{width:22px;height:22px;stroke-width:3}
.sheet-t{min-width:0;font-size:.94rem;color:var(--muted)}
.sheet-t b{font-family:var(--f-disp);font-weight:700;font-style:normal;font-size:1.3rem;display:block;line-height:1.2;color:var(--ink)}
.sheet.ok .sheet-t b{color:var(--good)} .sheet.no .sheet-t b{color:var(--bad)}
.sheet .sheet-btn{width:100%;color:#fff;box-shadow:none;font-family:var(--f-body)}
.sheet.ok .sheet-btn{background:var(--good)} .sheet.no .sheet-btn{background:var(--bad)}
.combo-line{display:flex;align-items:center;gap:4px;font-size:.82rem;font-weight:600;color:#FF9500;margin-top:4px}
.combo-line .flame{width:15px;height:15px}
/* practice list */
.modes{display:block;background:var(--surface);border-radius:12px;overflow:hidden;border:0}
.mode{display:grid;grid-template-columns:auto 1fr auto;grid-template-rows:auto auto;column-gap:12px;align-items:center;width:100%;padding:10px 16px;border:0!important;border-radius:0;background:none;box-shadow:none;text-align:left;position:relative;font:inherit;color:var(--ink)}
.modes .mode:nth-child(2n){border-left:0;padding-left:16px}
.mode+.mode::before{content:"";position:absolute;top:0;right:0;left:58px;height:.5px;background:var(--sep)}
.mode:active:not(:disabled){background:var(--press);transform:none;box-shadow:none}
.mode::after{content:"";grid-column:3;grid-row:1/3;width:8px;height:8px;border-right:2.4px solid var(--chev);border-top:2.4px solid var(--chev);transform:rotate(45deg);margin-right:4px}
.mode-ic{grid-row:1/3;width:30px;height:30px;border-radius:7px;background:var(--sc,var(--accent));color:#fff;display:grid;place-items:center;margin:0;box-shadow:none}
.mode-ic .ic{width:18px;height:18px;stroke-width:2}
.mode-t{font-family:var(--f-body);font-weight:400;font-size:1.0625rem;line-height:1.25}
.mode-d{font-size:.8rem;color:var(--muted);grid-column:2}
.mode-best{grid-column:3;grid-row:1/3;margin:0 22px 0 0!important;background:none;border:0;color:var(--muted);font-size:.85rem;padding:0;align-self:center}
.mode.warn .mode-t{color:var(--bad)}
.mode:disabled{opacity:.4}
.onbw .stack{gap:0!important;background:var(--surface);border-radius:12px;overflow:hidden}
.onbw .mode{grid-template-rows:auto auto auto;border:0!important;border-radius:0;padding:12px 16px}
.onbw .mode::after{grid-row:1/4}
.onbw .mode-t,.onbw .mode-d,.onbw .mode-ex{grid-column:1/3}
.onbw .mode-ex{font-family:var(--f-mono);font-size:.75rem;color:var(--muted);margin-top:2px}

.mode-ex{font-family:var(--f-mono)}

.medals{display:grid;grid-template-columns:repeat(4,1fr);gap:14px 6px;background:var(--surface);border-radius:20px;padding:16px 8px 14px}

/* ===== LIQUID GLASS: translucent panes over a slow-moving colour field ===== */
:root{
  --glass:rgba(255,255,255,.52); --glass-strong:rgba(255,255,255,.72); --glass-brd:rgba(255,255,255,.75);
  --glass-hi:rgba(255,255,255,.95); --glass-sh:0 10px 30px rgba(40,50,90,.10),0 1px 2px rgba(40,50,90,.06);
  --blur:saturate(180%) blur(22px);
  --aura-base:#EEF1FA; --a1:#7FB2FF; --a2:#FF9EC7; --a3:#9CF0D8; --a4:#FFD38A;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --glass:rgba(40,42,52,.48); --glass-strong:rgba(44,46,58,.72); --glass-brd:rgba(255,255,255,.16);
  --glass-hi:rgba(255,255,255,.28); --glass-sh:0 10px 30px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.3);
  --aura-base:#07080D; --a1:#2B4DFF; --a2:#C2186B; --a3:#0E9E8A; --a4:#8A4BFF}}
:root[data-theme="dark"]{
  --glass:rgba(40,42,52,.48); --glass-strong:rgba(44,46,58,.72); --glass-brd:rgba(255,255,255,.16);
  --glass-hi:rgba(255,255,255,.28); --glass-sh:0 10px 30px rgba(0,0,0,.35),0 1px 2px rgba(0,0,0,.3);
  --aura-base:#07080D; --a1:#2B4DFF; --a2:#C2186B; --a3:#0E9E8A; --a4:#8A4BFF}
body{background:var(--aura-base)}
#aura{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--aura-base);pointer-events:none;--px:0;--py:0}
#aura i{position:absolute;border-radius:50%;filter:blur(60px);opacity:.75;will-change:transform}
#aura .b1{width:70vmax;height:70vmax;left:-25vmax;top:-30vmax;background:radial-gradient(circle,var(--a1),transparent 65%);animation:drift1 22s ease-in-out infinite alternate;translate:calc(var(--px)*40px) calc(var(--py)*40px)}
#aura .b2{width:60vmax;height:60vmax;right:-25vmax;top:10vmax;background:radial-gradient(circle,var(--a2),transparent 65%);animation:drift2 26s ease-in-out infinite alternate;translate:calc(var(--px)*-50px) calc(var(--py)*30px)}
#aura .b3{width:65vmax;height:65vmax;left:-20vmax;bottom:-35vmax;background:radial-gradient(circle,var(--a3),transparent 65%);animation:drift3 30s ease-in-out infinite alternate;translate:calc(var(--px)*30px) calc(var(--py)*-45px)}
#aura .b4{width:45vmax;height:45vmax;right:-10vmax;bottom:-10vmax;background:radial-gradient(circle,var(--a4),transparent 65%);animation:drift1 34s ease-in-out infinite alternate-reverse;opacity:.6}
#aura .grain{inset:0;width:auto;height:auto;border-radius:0;filter:none;opacity:.05;background-image:radial-gradient(rgba(0,0,0,.6) 1px,transparent 1px);background-size:3px 3px}
@keyframes drift1{to{transform:translate(18vw,12vh) scale(1.15)}}
@keyframes drift2{to{transform:translate(-20vw,18vh) scale(.9)}}
@keyframes drift3{to{transform:translate(15vw,-16vh) scale(1.1)}}
/* glass material */
.group,.ringcard,.card,.opt,.modes,.scene,.medals,details,.list,.skills,.advice,.tiles,.cel-in,.slot,.chip,input[type=text],textarea,.filters button,.item,.sw-c,.bb-top{
  background:var(--glass)!important;backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);
  border:1px solid var(--glass-brd)!important;box-shadow:inset 0 1px 0 var(--glass-hi),var(--glass-sh)!important}
.sw-c{background:linear-gradient(135deg,var(--c) 50%,var(--cd) 50%)!important}
.slot .chip{background:color-mix(in srgb,var(--accent) 18%,var(--glass))!important;color:var(--accent)}
.opt.right{background:color-mix(in srgb,var(--good) 26%,var(--glass))!important;border-color:var(--good)!important}
.opt.wrong{background:color-mix(in srgb,var(--bad) 22%,var(--glass))!important;border-color:var(--bad)!important}
.scene.on{border-color:var(--accent)!important;box-shadow:inset 0 0 0 1.5px var(--accent),inset 0 1px 0 var(--glass-hi),var(--glass-sh)!important}
.grow+.grow::before,.mode+.mode::before{background:color-mix(in srgb,var(--sep) 70%,transparent)}
.ringcard{border-radius:28px}
.group,.modes,.list{border-radius:20px}
.medals{border-radius:24px}
details{border-radius:18px}
.card{border-radius:28px;background:var(--glass-strong)!important}
/* header floats on the field */
header{background:none}

nav{left:14px;right:14px;bottom:calc(10px + env(safe-area-inset-bottom,0px));max-width:420px;margin:0 auto;border-radius:30px;padding:6px 8px;
  background:var(--glass-strong);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-brd);box-shadow:inset 0 1px 0 var(--glass-hi),0 12px 40px rgba(0,0,0,.18)}

main{padding-bottom:120px}

.btn{background:var(--glass);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--glass-brd);box-shadow:inset 0 1px 0 var(--glass-hi),var(--glass-sh);color:var(--accent);border-radius:16px;transition:transform .25s cubic-bezier(.3,1.5,.5,1),opacity .15s}

.hf,.he{width:14px;height:13px;display:inline-block;clip-path:path("M7 13 L1.2 7 A3.4 3.4 0 0 1 7 2.4 A3.4 3.4 0 0 1 12.8 7 Z")}

.bb-field{position:relative;height:calc(100vh - 330px);min-height:360px;margin-top:12px;overflow:hidden;border-radius:26px}
.bub{position:absolute;left:0;top:0;border-radius:50%;border:1px solid rgba(255,255,255,.7);padding:6px;display:grid;place-items:center;cursor:pointer;color:var(--ink);font:inherit;font-weight:700;font-size:.92rem;line-height:1.15;text-align:center;

const itemById=id=>ITEMS.find(x=>x.id===id);
const coins=()=>Math.floor(S.xp/4)+(S.bonusC||0)-(S.spent||0);
const wear=()=>S.wear||(S.wear={});
const themeId=()=>(S.theme&&itemById(S.theme))?S.theme:"blue";
function applyTheme(){const t=itemById(themeId()),r=document.documentElement;r.style.setProperty("--acc-l",t.l);r.style.setProperty("--acc-d",t.d)}
const petStage=l=>l<=1?0:l<=3?1:l<=5?2:l<=7?3:4;
const STAGE_NAME=["新手","入門","進階","熟練","大師"];
const newToday=()=>((S.nd||{})[today()]||0);
function ringVals(){const done=S.days[today()]||0,t=tdToday(),plan=trainPlan();
  return [Math.min(1.5,done/S.goal),plan.filter(s=>t.done.includes(s.k)).length/plan.length,Math.min(1.5,newToday()/TL().nw)]}
function rings(v,size,cls){
  const R=[44,33,22],W=9.5,col=["var(--ring1)","var(--ring2)","var(--ring3)"];
  return `<svg class="rings ${cls||""}" width="${size}" height="${size}" viewBox="0 0 104 104" aria-hidden="true">${R.map((r,i)=>{const C=2*Math.PI*r,p=Math.max(0,v[i]);
    const over=p>1?`<circle cx="52" cy="52" r="${r}" fill="none" stroke="${col[i]}" stroke-width="${W}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-(p-1))}" transform="rotate(-90 52 52)" style="filter:drop-shadow(0 0 1.5px rgba(0,0,0,.35))"/>`:"";
    return `<circle cx="52" cy="52" r="${r}" fill="none" stroke="${col[i]}" stroke-opacity=".2" stroke-width="${W}"/>
      <circle class="rg" style="--c:${C};--o:${C*(1-Math.min(1,p))}" cx="52" cy="52" r="${r}" fill="none" stroke="${col[i]}" stroke-width="${W}" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-Math.min(1,p))}" transform="rotate(-90 52 52)" ${p<=0?'opacity="0"':""}/>${over}`}).join("")}</svg>`}
function mascot(o={}){return rings(o.demo?[.72,.5,.34]:ringVals(),o.size||120,o.anim==="idle"?"":"")}
function petLine(){
  const done=S.days[today()]||0,g=S.goal,hr=new Date().getHours(),t=tdToday(),plan=trainPlan(),all=plan.every(s=>t.done.includes(s.k));
  if(done>=g&&all&&newToday()>=TL().nw)return ["","三個圓環都完成了。"];
  if(done>=g&&all)return ["",`再學 ${Math.max(0,TL().nw-newToday())} 個新字，就能完成所有圓環。`];
  if(all)return ["",`今日訓練已完成，再 ${Math.max(0,g-done)} 題達成目標。`];
  if(done>0)return ["",`再 ${g-done} 題達成今日目標。`];
  if(hr>=22||hr<5)return ["","睡前花幾分鐘複習，記得更牢。"];
  if(streak()>0)return ["",`已連續 ${streak()} 天。`];
  return ["",`今天還沒開始，今日訓練約需 ${minutesOf(trainPlan())} 分鐘。`];
}

/* ================= ANSWER SHEET ================= */
function showSheet(ok,title,detail,btnLabel,onNext){
  const old=document.querySelector(".sheet");if(old)old.remove();
  const el=document.createElement("div");el.className="sheet "+(ok?"ok":"no");el.setAttribute("role","status");
  el.innerHTML=`<div class="grab"></div><div class="sheet-in"><div class="sheet-m">${icon(ok?"check":"cross")}</div>
    <div class="sheet-t"><b>${title}</b><div>${detail}</div></div></div>
    <button class="btn primary sheet-btn">${btnLabel}</button>`;
  document.body.appendChild(el);requestAnimationFrame(()=>el.classList.add("in"));

/* ================= tiny low-poly 3D engine (canvas 2D, painter's algorithm) ================= */
const E3={};
E3.hex=c=>{if(Array.isArray(c))return c;c=c.replace("#","");return [parseInt(c.slice(0,2),16),parseInt(c.slice(2,4),16),parseInt(c.slice(4,6),16)]};
E3.rng=seed=>()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
/* primitives: {v:[[x,y,z]], f:[{i:[...], t:"side"|"top"|"bot"}]} centred on origin, y up */
E3.box=(w,h,d)=>{const x=w/2,y=h/2,z=d/2;return{v:[[-x,-y,-z],[x,-y,-z],[x,y,-z],[-x,y,-z],[-x,-y,z],[x,-y,z],[x,y,z],[-x,y,z]],
  f:[{i:[0,1,2,3],t:"side"},{i:[4,5,6,7],t:"side"},{i:[0,4,7,3],t:"side"},{i:[1,5,6,2],t:"side"},{i:[3,2,6,7],t:"top"},{i:[0,1,5,4],t:"bot"}]}};
E3.cyl=(rt,rb,h,n)=>{const v=[],f=[];for(let k=0;k<n;k++){const a=k/n*Math.PI*2;v.push([Math.cos(a)*rt,h/2,Math.sin(a)*rt])}
  for(let k=0;k<n;k++){const a=k/n*Math.PI*2;v.push([Math.cos(a)*rb,-h/2,Math.sin(a)*rb])}
  for(let k=0;k<n;k++){const k2=(k+1)%n;f.push({i:[k,k2,n+k2,n+k],t:"side"})}
  if(rt>0)f.push({i:[...Array(n).keys()],t:"top"});if(rb>0)f.push({i:[...Array(n).keys()].map(k=>n+k),t:"bot"});return{v,f}};
E3.cone=(r,h,n)=>{const v=[[0,h/2,0]],f=[];for(let k=0;k<n;k++){const a=k/n*Math.PI*2;v.push([Math.cos(a)*r,-h/2,Math.sin(a)*r])}
  for(let k=0;k<n;k++)f.push({i:[0,1+k,1+(k+1)%n],t:"side"});f.push({i:[...Array(n).keys()].map(k=>1+k),t:"bot"});return{v,f}};
E3.sphere=(r,lat,lon)=>{const v=[[0,r,0]],f=[];for(let i=1;i<lat;i++){const p=i/lat*Math.PI;for(let j=0;j<lon;j++){const a=j/lon*Math.PI*2;v.push([Math.sin(p)*Math.cos(a)*r,Math.cos(p)*r,Math.sin(p)*Math.sin(a)*r])}}
  v.push([0,-r,0]);const last=v.length-1,ring=i=>1+(i-1)*lon;
  for(let j=0;j<lon;j++)f.push({i:[0,ring(1)+j,ring(1)+(j+1)%lon],t:"side"});
  for(let i=1;i<lat-1;i++)for(let j=0;j<lon;j++){const a=ring(i)+j,b=ring(i)+(j+1)%lon,c=ring(i+1)+(j+1)%lon,d=ring(i+1)+j;f.push({i:[a,b,c,d],t:"side"})}
  for(let j=0;j<lon;j++)f.push({i:[last,ring(lat-1)+(j+1)%lon,ring(lat-1)+j],t:"side"});return{v,f}};
E3.disc=(r,n)=>{const v=[];for(let k=0;k<n;k++){const a=k/n*Math.PI*2;v.push([Math.cos(a)*r,0,Math.sin(a)*r])}return{v,f:[{i:[...Array(n).keys()],t:"top",ds:1}]}};
E3.poly=pts=>({v:pts,f:[{i:pts.map((_,k)=>k),t:"top",ds:1}]});
function rot(p,o){let [x,y,z]=p;const s=o.s||[1,1,1];x*=s[0];y*=s[1];z*=s[2];
  if(o.rz){const c=Math.cos(o.rz),n=Math.sin(o.rz);[x,y]=[x*c-y*n,x*n+y*c]}
  if(o.rx){const c=Math.cos(o.rx),n=Math.sin(o.rx);[y,z]=[y*c-z*n,y*n+z*c]}
  if(o.ry){const c=Math.cos(o.ry),n=Math.sin(o.ry);[x,z]=[x*c+z*n,-x*n+z*c]}
  const t=o.pos||[0,0,0];return [x+t[0],y+t[1],z+t[2]]}
/* add a primitive to a mesh. o: {pos,rx,ry,rz,s,c,top,side,bot,e,L} */
E3.add=(m,p,o)=>{const base=m.v.length,ctr=rot([0,0,0],o);for(const q of p.v)m.v.push(rot(q,o));
  for(const f of p.f){const col=E3.hex((f.t==="top"&&o.top)||(f.t==="bot"&&o.bot)||(f.t==="side"&&o.side)||o.c||"#cccccc");
    const ii=f.i.map(k=>k+base),a=m.v[ii[0]],b=m.v[ii[1]],c=m.v[ii[2]];
    let n=E3.nrm(E3.cross(E3.sub(b,a),E3.sub(c,a)));const fc=E3.avg(ii.map(k=>m.v[k]));if(!f.ds&&E3.dot(n,E3.sub(fc,ctr))<0)n=n.map(x=>-x);if(f.ds&&n[1]<0)n=n.map(x=>-x);
    m.f.push({i:ii,c:o.jit?E3.jit(col,o.jit):col,n,ds:!!f.ds,e:o.e||0,L:o.L??3,a:o.a??1})}return m};
E3.sub=(a,b)=>[a[0]-b[0],a[1]-b[1],a[2]-b[2]];E3.cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
E3.dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];E3.nrm=a=>{const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l]};
E3.avg=ps=>{let x=0,y=0,z=0;for(const p of ps){x+=p[0];y+=p[1];z+=p[2]}const n=ps.length;return [x/n,y/n,z/n]};
E3.jit=(c,a)=>{const r=(Math.random()-.5)*a;return c.map(x=>Math.max(0,Math.min(255,x+r)))};
E3.mesh=()=>({v:[],f:[]});
/* object: {m: mesh in local coords, tf:(t)=>({pos,rx,ry,rz,s}) optional} ; static objects have no tf */
E3.render=(ctx,W,H,objs,cam,env,t)=>{
  const cy=Math.cos(cam.yaw),sy=Math.sin(cam.yaw),cp=Math.cos(cam.pitch),sp=Math.sin(cam.pitch),D=cam.dist,F=H*cam.fov,ox=W/2,oy=H*cam.cy;
  const L=E3.nrm(env.light),amb=env.amb,tint=env.tint,ta=env.ta||0,faces=[],glows=[];
  const view=p=>{let x=p[0],y=p[1]-cam.ty,z=p[2];[x,z]=[x*cy+z*sy,-x*sy+z*cy];[y,z]=[y*cp-z*sp,y*sp+z*cp];return [x,y,z]};
  for(const o of objs){let V=o.m.v,tr=null;if(o.tf){tr=o.tf(t);if(!tr)continue;V=V.map(p=>rot(p,tr))}
    const VV=V.map(view);
    for(const f of o.m.f){const pts=f.i.map(k=>VV[k]);let n=f.n;if(tr){n=rot(n,{rx:tr.rx,ry:tr.ry,rz:tr.rz});}
      const nv=view([n[0],n[1]+cam.ty,n[2]]);const c=E3.avg(pts);
      if(!f.ds&&E3.dot(nv,[-c[0],-c[1],D-c[2]])<=0)continue;
      let k;if(f.e&&env.night)k=1.15;else{const d=Math.max(0,E3.dot(n,L));k=amb+(1-amb)*d;if(f.ds)k=Math.max(k,amb+.25)}
      let col=f.c.map(x=>x*k);if(ta&&!(f.e&&env.night))col=col.map((x,i)=>x*(1-ta)+tint[i]*ta*k);
      faces.push({p:pts,z:c[2],L:f.L,col:f.a<1?`rgba(${col[0]|0},${col[1]|0},${col[2]|0},${f.a})`:`rgb(${col[0]|0},${col[1]|0},${col[2]|0})`,a:f.a});
      if(f.e&&env.night&&f.e>1)glows.push(c)}}
  faces.sort((a,b)=>a.L-b.L||a.z-b.z);
  const pr=p=>{const s=F/(D-p[2]);return [ox+p[0]*s,oy-p[1]*s]};
  ctx.lineJoin="round";
  for(const f of faces){ctx.beginPath();f.p.forEach((p,i)=>{const [x,y]=pr(p);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.closePath();ctx.fillStyle=f.col;ctx.fill();if(f.a>=1){ctx.strokeStyle=f.col;ctx.lineWidth=.7;ctx.stroke()}}
  for(const g of glows){const [x,y]=pr(g),r=F/(D-g[2])*.28;const gr=ctx.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,"rgba(255,226,140,.42)");gr.addColorStop(1,"rgba(255,226,140,0)");ctx.fillStyle=gr;ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.fill()}
  return {project:p=>pr(view(p)),faces:faces.length};

function pickWord(filter){

  const fresh=pool.filter(w=>!recent.includes(w.id));if(fresh.length>=4)pool=fresh;

  let w=null;if(g.length){let r=Math.random()*g.reduce((a,x)=>a+x[0],0);for(const [p,l] of g){if((r-=p)<=0){w=pick(l);break}}}

let CD=null;
function runCards(deck,label,onEnd){ROOT=false;CD={deck,i:0,flipped:false,label,onEnd,again:{}};drawCard()}

  if(c.i>=c.deck.length){if(c.onEnd)return c.onEnd();

    <div class="stack"><button class="btn primary" onclick="runQuiz({total:10})">做一輪測驗</button>
    <button class="btn" onclick="runCards(shuffle(ACTIVE()).slice(0,10),'自由複習')">不管排程，再看 10 個字</button></div>`;return}
  const w=c.deck[c.i],b=srs(w.id).box;
  view().innerHTML=`${backBtn()}<h2>${c.label}</h2><p class="sub">先自己想意思，再翻面。第 ${c.i+1} / ${c.deck.length} 張</p>
  <div class="progress"><i style="width:${c.i/c.deck.length*100}%"></i></div>
  <div class="card ${c.flipped?"flipin":""}" id="card" role="button" tabindex="0" aria-label="翻面" style="--sc:${SC[w.cat]}">
    <div class="card-band">${icon(w.cat)}<span>${CATS[w.cat]}</span><span class="stage s${stageOf(b)}">${STAGES[stageOf(b)]}</span></div>
    <div class="row" style="justify-content:flex-end;align-items:center;margin-top:-6px">${spkBtn(w.w)}</div>

    <div class="row" style="align-items:center;gap:8px"><span class="ipa">${esc(w.ipa)}</span><span class="pos">${esc(w.pos)}</span></div>
    ${c.flipped?`<div class="meaning">${esc(w.zh)}</div>
      ${w.ex?`<div class="ex"><div class="row" style="align-items:center;gap:8px;flex-wrap:nowrap"><div style="min-width:0">${esc(w.ex)}</div>${spkBtn(w.ex,"播放例句")}</div><div class="zh">${esc(w.exZh)}</div></div>`:""}`
      :`<div class="hint">點一下看中文意思${w.ex?"和例句":""}</div>`}
  </div>
  <div class="row" style="margin-top:12px">${c.flipped?`
    <button class="btn bad" data-g="0">忘了</button><button class="btn meh" data-g="1">模糊</button><button class="btn good" data-g="2">記得</button>`
    :`<button class="btn primary" id="flip">翻面</button>`}</div>
  ${c.flipped?`<p class="note" style="text-align:center;margin-top:10px">也可以滑動卡片：← 忘了　↑ 模糊　記得 →</p>`:""}`;
  const flip=()=>{if(!c.flipped){c.flipped=true;drawCard();say(w.w)}};
  $("#card").onclick=flip;$("#card").onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();flip()}};
  if($("#flip"))$("#flip").onclick=flip;
  const doGrade=(g,btn)=>{review(w.id,g,"card",btn||$("#card"));sfx(g===0?"bad":"ok");
    if(g===0&&!c.again[w.id]){c.again[w.id]=1;c.deck.push(w)}c.i++;c.flipped=false;drawCard()};
  view().querySelectorAll("[data-g]").forEach(btn=>btn.onclick=()=>doGrade(+btn.dataset.g,btn));
  if(c.flipped)enableSwipe($("#card"),g=>doGrade(g));

/* ================= QUIZ ================= */
const MODES=["en","zh","ex","syn","ant","col"];
const MODE_LABEL={en:"選出中文意思",zh:"選出對應的英文",ex:"選出填入空格的字",syn:"選出意思最接近的字",ant:"選出意思相反的字",col:"選出正確的搭配詞"};
const KIND={en:"rec",zh:"recall",ex:"cloze"};
let QZ=null;
function runQuiz(o){ROOT=false;const types=o.types||MODES,total=o.total||10;
  QZ={n:0,score:0,combo:0,total,onEnd:o.onEnd,order:shuffle(Array.from({length:total},(_,i)=>types[i%types.length]))};nextQ()}
function nextQ(){
  const q=QZ;
  if(q.n>=q.total){
    if(q.score===q.total&&q.total>=10){S.perfects++;save();checkAch()}
    if(q.onEnd){toast(`測驗 ${q.score} / ${q.total}`);return q.onEnd()}
    if(q.score===q.total)setTimeout(()=>sfx("level"),200);
    view().innerHTML=`${backBtn()}<h2>${q.score===q.total?"滿分！":"測驗結果"}</h2><div class="stack"><div class="result-row"><div class="big">${q.score}<small>/ ${q.total}</small></div></div>
    <p class="sub" style="margin:0">${q.score>=9?"非常好，這些你已經很熟了。":q.score>=6?"不錯，答錯的字已經放進錯題本。":"答錯的字已經放進錯題本，先複習再回來挑戰。"}</p>
    <div class="row"><button class="btn primary" onclick="runQuiz({total:10})">再測一次</button><button class="btn" onclick="go('weak')">看弱點</button></div></div>`;return}
  let mode=q.order[q.n],w=null,prompt,opts,correct,explain="",speakFirst=null;
  if(mode==="ex"){w=pickWord(clozeOK);if(!clozeOK(w))mode="en";else prompt=`<div style="font-size:1.25rem">${esc(w.ex.replace(new RegExp("\\b"+stemOf(w)+"\\w*","i"),"_____"))}</div><div class="note">${esc(w.exZh)}</div>`}
  if(mode==="en"||mode==="zh"||mode==="ex"){
    if(mode!=="ex")w=pickWord();
    const others=shuffle(ALL().filter(x=>x.id!==w.id&&x.zh!==w.zh&&x.w!==w.w)),same=others.filter(x=>x.pos===w.pos);
    const o=shuffle([w,...(same.length>=3?same:others).slice(0,3)]);correct=o.indexOf(w);
    if(mode==="en"){prompt=`<div class="row" style="align-items:center;justify-content:space-between;flex-wrap:nowrap"><div class="q">${esc(w.w)}</div>${spkBtn(w.w)}</div><div class="ipa">${esc(w.ipa)}</div>`;opts=o.map(x=>esc(x.zh));speakFirst=w.w}
    else if(mode==="zh"){prompt=`<div class="q">${esc(w.zh)}</div>`;opts=o.map(x=>esc(x.w))}
    else opts=o.map(x=>esc(x.w));
    explain=`${esc(w.w)}：${esc(w.zh)}`;
  }else if(mode==="syn"||mode==="ant"){
    const src=mode==="syn"?SYN:ANT,p=pick(src);
    const dis=shuffle(src.filter(x=>x!==p).flatMap(x=>[x[0],x[1]]).filter(x=>x!==p[0]&&x!==p[1])).slice(0,3);
    const o=shuffle([p[1],...dis]);correct=o.indexOf(p[1]);opts=o.map(esc);
    prompt=`<div class="row" style="align-items:center;justify-content:space-between;flex-wrap:nowrap"><div class="q">${esc(p[0])}</div>${spkBtn(p[0])}</div>`;
    explain=`${p[0]} ${mode==="syn"?"≈":"↔"} ${p[1]}（${p[2]}）`;speakFirst=p[0];
  }else{const c=pick(COL),o=shuffle(c[2]);correct=o.indexOf(c[1]);opts=o.map(esc);
    prompt=`<div class="q">${esc(c[0])}</div><div class="note">${c[3]}</div>`;explain=`${c[0].replace("___",c[1])}（${c[3]}）`}
  clearSheet();view().innerHTML=`${backBtn()}<h2>${q.onEnd?"弱點測驗":"測驗"}</h2><p class="sub">第 ${q.n+1} / ${q.total} 題 · 答對 ${q.score}${q.combo>=2?`<span class="combo">連對 ×${q.combo}</span>`:""}</p>
  <div class="progress"><i style="width:${q.n/q.total*100}%"></i></div>
  <div class="kind" style="margin-top:20px">${MODE_LABEL[mode]}</div>
  <div class="stack">${prompt}</div>
  <div class="opts" style="margin-top:20px">${opts.map((o,i)=>`<button class="opt" data-i="${i}">${o}</button>`).join("")}</div>
  <div id="fb" hidden></div>`;
  if(speakFirst)say(speakFirst);
  let answered=false;
  view().querySelectorAll(".opt").forEach(b=>b.onclick=()=>{
    if(answered)return;answered=true;const ok=+b.dataset.i===correct;
    view().querySelectorAll(".opt")[correct].classList.add("right");if(!ok)b.classList.add("wrong");
    if(ok){q.score++;q.combo++;if(q.combo>S.maxCombo){S.maxCombo=q.combo;save()}}else q.combo=0;
    if(q.combo>=2)island(`${FLAME}<b>${q.combo}</b><span>連對</span>`);
    sfx(ok?"ok":"bad");
    if(w)review(w.id,ok?2:0,KIND[mode],b);else{logAcc("rec",ok);addAct();gainXP(ok?6:2,b)}
    let extra="";if(ok&&q.combo>=3){const bonus=q.combo*2;setTimeout(()=>gainXP(bonus,b),350);extra=`<div class="combo-line">${FLAME} 連對 ×${q.combo}，額外 +${bonus} XP</div>`}
    if(w&&w.ex)say(w.ex);
    q.n++;showSheet(ok,ok?pick(PRAISE):"正確答案是…",explain+extra,q.n>=q.total?"完成":"繼續",nextQ)});
}

let rush=null,rushTimer=null;
function startRush(){ROOT=false;
  rush={score:0,end:Date.now()+60000,wrong:0,streak:0};
  view().innerHTML=`${backBtn()}<div class="rush-top"><div class="big" id="rScore">0</div><div class="rush-time" id="rTime">60</div></div>
    <div class="timebar"><i id="rBar"></i></div><div class="rush-combo" id="rCombo"></div>
    <div id="rQ" class="stack" style="margin-top:24px"></div><div class="opts" id="rOpts" style="margin-top:20px"></div>`;
  clearInterval(rushTimer);
  rushTimer=setInterval(()=>{if(!rush){clearInterval(rushTimer);return}const ms=rush.end-Date.now(),s=Math.max(0,Math.ceil(ms/1000));
    const bar=$("#rBar"),tm=$("#rTime");if(!bar){clearInterval(rushTimer);return}
    bar.style.width=Math.max(0,ms/600)+"%";if(+tm.textContent!==s){tm.textContent=s;if(s<=5&&s>0)sfx("tick")}
    tm.classList.toggle("hot",s<=10);if(ms<=0){clearInterval(rushTimer);endRush()}},100);
  rushQ();
}
function rushQ(){
  const w=pick(ACTIVE()),o=shuffle([w,...shuffle(ALL().filter(x=>x.id!==w.id&&x.zh!==w.zh)).slice(0,3)]);
  $("#rQ").innerHTML=`<div class="q">${esc(w.w)}</div>`;
  $("#rOpts").innerHTML=o.map((x,i)=>`<button class="opt" data-i="${i}">${esc(x.zh)}</button>`).join("");
  let done=false;
  $("#rOpts").querySelectorAll(".opt").forEach(b=>b.onclick=()=>{if(done||!rush)return;done=true;const ok=o[+b.dataset.i]===w;logAcc("rec",ok);
    if(ok){rush.score++;rush.streak++;b.classList.add("right");sfx("ok")}
    else{rush.wrong++;rush.streak=0;rush.end-=3000;b.classList.add("wrong");$("#rOpts").querySelectorAll(".opt")[o.indexOf(w)].classList.add("right");sfx("bad");markWeak(w.id,"rec");save()}
    $("#rScore").textContent=rush.score;$("#rScore").classList.remove("bump");void $("#rScore").offsetWidth;if(ok)$("#rScore").classList.add("bump");
    $("#rCombo").textContent=rush.streak>=3?`連對 ×${rush.streak}`:"";
    setTimeout(()=>{if(rush&&rush.end>Date.now()&&$("#rQ"))rushQ()},ok?260:700)});
}
function endRush(){earn(Math.floor((rush?rush.score:0)/2),0);
  const {score,wrong}=rush,rec=score>S.best;if(rec)S.best=score;save();addAct(score+wrong);rush=null;
  view().innerHTML=`${backBtn()}<h2>時間到</h2><div class="stack">
    <div class="result-row"><div><div class="big">${score}<small>題答對</small></div><p class="sub" style="margin:8px 0 0">答錯 ${wrong} 題${rec?" · 新紀錄！":` · 最佳紀錄 ${S.best} 題`}</p></div></div>
    <div class="row"><button class="btn primary" onclick="startRush()">再挑戰一次</button><button class="btn" onclick="go('practice')">回練習</button></div>
    ${wrong?`<p class="note">答錯的字已經放進錯題本。60 秒挑戰練的是反應，不會讓單字升級。</p>`:`<p class="note">60 秒挑戰練的是反應，不會讓單字升級。</p>`}</div>`;
  gainXP(score*3,$(".big"));if(rec&&score>0){confetti();sfx("level")}
}

/* ================= DICTATION ================= */
let LS=null;
const norm=s=>s.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z0-9' ]/g," ").split(/\s+/).filter(Boolean);
function runListen(o){ROOT=false;LS={n:o.n||Infinity,i:0,onEnd:o.onEnd};nextListen()}
function nextListen(){
  if(LS.i>=LS.n)return LS.onEnd&&LS.onEnd();
  const lt=pickWord(w=>w.ex);LS.cur=lt;LS.checked=false;
  view().innerHTML=`${backBtn()}<h2>聽寫</h2><p class="sub">${LS.n<Infinity?`第 ${LS.i+1} / ${LS.n} 句。`:""}聽一句英文，把聽到的打出來。每句只能檢查一次。</p>
  <div class="stack">
    <div class="row"><button class="btn primary" id="p1">播放</button><button class="btn" id="p2">慢速播放</button></div>
    <div><button class="link" id="sndTest">聽不到聲音？點這裡測試</button><div id="sndOut" class="note" style="margin-top:4px">${canSpeak?"":"這個瀏覽器不支援語音播放，請改用 Safari 或 Chrome 開啟。"}</div></div>
    <div class="field"><label for="dict">你聽到的句子</label>
    <input type="text" id="dict" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type what you hear…"></div>
    <div class="row"><button class="btn" id="hint">看中文提示</button><button class="btn primary" id="chk">檢查</button></div>
    <div id="hintBox" class="note" hidden>${esc(lt.exZh)}</div>
    <div id="res"></div>
  </div>`;
  $("#p1").onclick=()=>say(lt.ex);$("#p2").onclick=()=>say(lt.ex,0.65);$("#sndTest").onclick=soundTest;
  $("#hint").onclick=()=>{$("#hintBox").hidden=false};
  $("#dict").onkeydown=e=>{if(e.key==="Enter")check()};$("#chk").onclick=check;
  setTimeout(()=>say(lt.ex),300);
  function check(){
    if(LS.checked)return;
    if(!$("#dict").value.trim()){$("#dict").focus();toast("先打出你聽到的句子");return}
    LS.checked=true;$("#dict").readOnly=true;$("#chk").disabled=true;$("#hint").disabled=true;
    const target=lt.ex.split(/\s+/),tn=norm(lt.ex),got=norm($("#dict").value);
    const m=tn.length,n=got.length,L=Array.from({length:m+1},()=>Array(n+1).fill(0));
    for(let i=m-1;i>=0;i--)for(let j=n-1;j>=0;j--)L[i][j]=tn[i]===got[j]?L[i+1][j+1]+1:Math.max(L[i+1][j],L[i][j+1]);
    let i=0,j=0;const out=[];
    while(i<m||j<n){if(i<m&&j<n&&tn[i]===got[j]){out.push(`<span class="ok">${esc(target[i])}</span>`);i++;j++}
      else if(j<n&&(i>=m||L[i][j+1]>=L[i+1][j])){out.push(`<span class="miss">${esc(got[j])}</span>`);j++}
      else{out.push(`<span class="need">${esc(target[i])}</span>`);i++}}
    const pct=Math.round(L[0][0]/m*100),res=pct>=90?2:pct>=60?1:0;
    review(lt.id,res,"listen",$("#chk"));sfx(res===2?"ok":"bad");
    $("#res").innerHTML=`<div class="big" style="font-size:2rem;margin:6px 0">${pct}% <small>${pct===100?"Perfect!":pct>=90?"Great ears!":pct>=60?"Getting there.":"Try again!"}</small></div>
      <div class="diff">${out.join(" ")}</div>
      <p class="note">紅色底線＝漏掉或聽錯的字　刪除線＝多打的字${res===0?"　這個字已放進錯題本":""}</p>
      <div class="ex"><div>${esc(lt.ex)}</div><div class="zh">${esc(lt.exZh)}</div></div>
      <button class="btn primary" id="nx" style="width:100%;margin-top:16px">${LS.i+1>=LS.n?"完成":"下一句"}</button>`;
    $("#nx").onclick=()=>{LS.i++;nextListen()}}
}

/* ================= SENTENCE BUILDER ================= */
let BD=null;
function runBuild(o){ROOT=false;BD={n:o.n||Infinity,i:0,onEnd:o.onEnd};nextBuild()}
function nextBuild(){
  if(BD.i>=BD.n)return BD.onEnd&&BD.onEnd();
  const w=pickWord(x=>x.ex&&x.ex.split(/\s+/).length>=3),toks=w.ex.split(/\s+/);
  let bank=shuffle(toks.map((t,i)=>({t,i})));if(bank.every((x,k)=>x.i===k))bank.reverse();
  Object.assign(BD,{w,toks,bank,picked:[],done:false,missed:false});drawBuild();
}
function drawBuild(){const {w,bank,picked,done}=BD;
  view().innerHTML=`${backBtn()}<h2>造句</h2><p class="sub">${BD.n<Infinity?`第 ${BD.i+1} / ${BD.n} 句。`:""}把字塊排成正確的英文句子。點上方的字可以放回去。</p>
  <div class="stack">
    <div><div class="note">中文意思</div><div style="font-size:1.1rem">${esc(w.exZh)}</div></div>
    <div class="slot ${done?"win":""}" id="slot" aria-label="你的句子">${picked.map((x,k)=>`<button class="chip" data-p="${k}">${esc(x.t)}</button>`).join("")||'<span class="note" style="padding:8px 0">點下面的字塊開始造句</span>'}</div>
    <div class="bank">${bank.map((x,k)=>`<button class="chip" data-b="${k}">${esc(x.t)}</button>`).join("")}</div>
    <div class="feedback ${done?"ok":""}" id="bfb">${done?(BD.missed?"排對了。這句一開始有排錯，已記進錯題本。":pick(PRAISE)+" 一次就排對"):""}</div>
    <div class="row">${done?`<button class="btn primary" id="bnext" style="width:100%">${BD.i+1>=BD.n?"完成":"下一句"}</button>`
      :`<button class="btn" id="clr">重來</button><button class="btn primary" id="bchk" ${picked.length&&!bank.length?"":"disabled"}>檢查</button>`}</div>
  </div>`;
  if(done){$("#bnext").onclick=()=>{BD.i++;nextBuild()};return}
  view().querySelectorAll("[data-b]").forEach(b=>b.onclick=()=>{BD.picked.push(BD.bank.splice(+b.dataset.b,1)[0]);drawBuild()});
  view().querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>{BD.bank.push(BD.picked.splice(+b.dataset.p,1)[0]);drawBuild()});
  $("#clr").onclick=()=>{BD.bank=BD.bank.concat(BD.picked);BD.picked=[];drawBuild()};
  $("#bchk").onclick=()=>{const ok=BD.picked.map(x=>x.t).join(" ")===BD.toks.join(" ");
    if(ok){BD.done=true;if(!BD.missed)review(w.id,2,"build",$("#bchk"));else gainXP(3,$("#bchk"));sfx("ok");say(w.ex);drawBuild()}
    else{if(!BD.missed){BD.missed=true;review(w.id,0,"build",$("#bchk"))}sfx("bad");const fb=$("#bfb");fb.className="feedback no";fb.textContent="順序還不對，再調整看看。";
      $("#slot").classList.remove("shake");void $("#slot").offsetWidth;$("#slot").classList.add("shake")}};
}

/* ================= WEAKNESS / ANALYSIS ================= */
function accSum(days){const out={};Object.keys(SKILLS).forEach(k=>out[k]=[0,0]);const d=new Date();
  for(let i=0;i<days;i++){const a=S.accd[dkey(d)];if(a)for(const k in a)if(out[k]){out[k][0]+=a[k][0];out[k][1]+=a[k][1]}d.setDate(d.getDate()-1)}return out}
function weak(){
  enter("weak");ROOT=true;

  const wk7=Object.values(S.mt).filter(d=>(Date.now()-new Date(d+"T00:00").getTime())<7*864e5).length;
  const acc=accSum(14),total=Object.values(acc).reduce((a,x)=>a+x[1],0);
  const rated=Object.entries(acc).filter(([,x])=>x[1]>=5).map(([k,x])=>[k,x[0]/x[1]]).sort((a,b)=>a[1]-b[1]);

    </section>
    <section>
      <div class="sec-h"><span>能力表現</span><span class="note">最近 14 天</span></div>
      <div class="skills">${Object.entries(SKILLS).map(([k,n])=>{const [o,t]=acc[k],p=t?Math.round(o/t*100):0;
        return `<div class="skill"><span class="sk-n">${n}</span><span class="sk-bar"><i class="${t>=5&&p<70?"low":""}" style="width:${t>=5?p:0}%"></i></span><span class="sk-v">${t>=5?p+"%":t?"資料不足":"—"}</span></div>`}).join("")}</div>

    +(listCat==="all"&&!k&&ALL().length>60?`<p class="note">只顯示前 60 個，用搜尋或分類找其他字。</p>`:"")
    :`<p class="note">${listCat==="c"&&!k?"還沒有自己的單字，用上面的「新增我的單字」加入。":"找不到符合的單字。"}</p>`);

  $("#wl").querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{const id=b.dataset.del;
    if(delArmed!==id){delArmed=id;drawList();return}
    S.custom=S.custom.filter(x=>x.id!==id);delete S.srs[id];delete S.wk[id];delArmed=null;save();drawList()});
}

/* ================= ONBOARDING ================= */
let OB={lvl:null,cats:null};
function onboarding(step){ROOT=false;
  document.body.classList.add("onb");
  if(step===1){
    view().innerHTML=`<div class="stack onbw"><div class="inter-pet">${mascot({demo:true,size:96})}<div class="bubble">每天完成三個圓環：答題、今日訓練、新學的字。</div></div><div><div class="label">設定 1 / 2</div><h2 style="margin-top:6px">你的英文程度？</h2>
      <p class="sub" style="margin:0">App 會先從這個程度以下的字開始，之後可以在設定改。</p></div>
      <div class="stack" style="gap:10px">${LEVELS.map(([k,n,d,ex])=>`<button class="mode ${S.lvl===k&&S.onb?"sel":""}" data-lv="${k}"><span class="mode-t">${n}</span><span class="mode-d">${d}</span><span class="mode-ex">${ex}</span></button>`).join("")}</div></div>`;
    view().querySelectorAll("[data-lv]").forEach(b=>b.onclick=()=>{OB.lvl=b.dataset.lv;onboarding(2)});
  }else{
    OB.cats=OB.cats||(S.onb||Object.keys(S.srs).length?S.cats.slice():["food","shop","move","trip","social","home"]);
    const draw=()=>{view().innerHTML=`<div class="stack onbw"><div><div class="label">設定 2 / 2</div><h2 style="margin-top:6px">你最想用英文做什麼？</h2>
      <p class="sub" style="margin:0">可以多選，之後在單字庫隨時調整。</p></div>
      <div class="filters big-chips">${Object.entries(SCENES).filter(([k])=>k!=="c").map(([k,[zh]])=>`<button data-c="${k}" aria-pressed="${OB.cats.includes(k)}">${zh}</button>`).join("")}</div>
      <button class="btn primary cta" id="obGo" ${OB.cats.length?"":"disabled"}>開始學習<span aria-hidden="true">→</span></button>
      <button class="link" id="obBack" style="align-self:flex-start">← 回上一步</button></div>`;
      view().querySelectorAll("[data-c]").forEach(b=>b.onclick=()=>{const k=b.dataset.c;OB.cats=OB.cats.includes(k)?OB.cats.filter(x=>x!==k):OB.cats.concat(k);draw()});
      $("#obBack").onclick=()=>onboarding(1);
      $("#obGo").onclick=()=>{S.lvl=OB.lvl||S.lvl;S.cats=OB.cats.concat(S.custom.length?["c"]:[]);S.onb=true;save();document.body.classList.remove("onb");home();toast(`已設定：${lvName()} · ${OB.cats.length} 個場景`)}};
    draw();
  }
}

applyTheme();mountAura();musicSetup();applyBg();useFreezes();setInterval(()=>renderHeader(),30000);$("#flameI").innerHTML=FLAME;$("#coinI").innerHTML=COIN;$("#coinChip").onclick=()=>shop();
renderTabs();renderHeader();
if(!S.onb)onboarding(1);else home();
checkAch();cloudInit();
</script>

</body>
